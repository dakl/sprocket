<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sprocket viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
    canvas { display: block; }

    #hint, #status {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.85);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      padding: 6px 12px;
      border-radius: 6px;
      display: none;
      pointer-events: none;
    }

    /* Top-centre, not next to #status: a dropped op has to stay readable
       while the extrude and selection panels sit at the bottom. */
    #warning {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      background: #3a1d1a;
      border: 1px solid #d0453a;
      color: #ff9a8a;
      font: 13px -apple-system, sans-serif;
      padding: 6px 12px;
      border-radius: 6px;
      display: none;
      pointer-events: none;
      max-width: 70%;
    }

    #extrude-panel, #selection-panel {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.9);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    /* Editable, not a readout: the drag writes into it, and typing over it
       sets the distance exactly (see applyTypedDistance). */
    #extrude-distance {
      width: 6em;
      font: 13px -apple-system, sans-serif;
      color: #eee;
      background: #1c1c1c;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
    }

    #extrude-distance:focus { outline: none; border-color: #5be0a0; }

    #extrude-panel button, #selection-panel button {
      font: 13px -apple-system, sans-serif;
      padding: 4px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    #extrude-ok, #selection-extrude { background: #5be0a0; color: #103; }
    #extrude-cancel, #selection-cancel { background: #444; color: #eee; }
    #selection-shortcut { color: #999; }

    #timeline {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40px;
      background: rgba(20, 20, 20, 0.95);
      border-top: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .timeline-chip {
      font: 12px -apple-system, sans-serif;
      color: #ccc;
      background: #2c2c2c;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 4px 8px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .timeline-chip:hover { border-color: #5be0a0; }

    .timeline-chip.timeline-chip-inactive {
      opacity: 0.4;
      border-style: dashed;
    }

    /* An op the engine could not apply to the current geometry, usually
       because an earlier sketch was edited under it. */
    .timeline-chip.timeline-chip-failed {
      color: #ff9a8a;
      border-color: #d0453a;
      background: #3a1d1a;
      opacity: 1;
    }

    .timeline-chip .timeline-icon { margin-right: 3px; }
    .timeline-chip .timeline-icon svg { width: 12px; height: 12px; vertical-align: -2px; }

    /* --- Toolbar -------------------------------------------------------
       One row of grouped icon buttons. There is no workspace tab strip:
       sprocket models one solid part, so there is nothing to switch to.
       A disabled button is a placeholder: the op is not written yet, rather
       than unavailable right now. */
    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #262626;
      border-bottom: 1px solid #111;
      color: #ccc;
      user-select: none;
      z-index: 10;
    }

    #toolbar-groups { display: flex; align-items: stretch; padding: 4px 8px 0; }

    .tool-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      border-right: 1px solid #333;
    }

    .tool-group:last-child { border-right: none; }

    .tool-group-buttons { display: flex; gap: 2px; }

    .tool-group-label {
      font: 9px -apple-system, sans-serif;
      letter-spacing: 0.08em;
      color: #777;
      padding: 2px 0 3px;
    }

    .tool-button {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #ddd;
      cursor: pointer;
    }

    .tool-button svg { width: 18px; height: 18px; }
    .tool-button:hover:not(:disabled) { background: #333; border-color: #5be0a0; color: #5be0a0; }
    .tool-button.active { border-color: #5be0a0; color: #5be0a0; }
    .tool-button:disabled { color: #555; cursor: default; }

    /* --- Browser tree --------------------------------------------------
       Visibility only, for now: one eye per body and per sketch. */
    #browser {
      position: fixed;
      top: 62px;
      left: 0;
      width: 210px;
      max-height: calc(100% - 126px);
      overflow-y: auto;
      background: rgba(28, 28, 28, 0.95);
      border: 1px solid #333;
      border-left: none;
      border-radius: 0 6px 6px 0;
      font: 12px -apple-system, sans-serif;
      color: #ddd;
      user-select: none;
      z-index: 5;
    }

    #browser-header {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #888;
      padding: 6px 10px;
      border-bottom: 1px solid #333;
    }

    #browser-tree { padding: 4px 0 8px; }

    .browser-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px 2px 0;
      cursor: default;
    }

    .browser-row:hover { background: #2c2c2c; }
    .browser-row.selected { background: #33443c; }

    .browser-caret {
      flex: 0 0 auto;
      width: 12px;
      color: #888;
      text-align: center;
    }

    .browser-caret.clickable { cursor: pointer; }

    .browser-eye {
      flex: 0 0 auto;
      display: flex;
      color: #bbb;
      cursor: pointer;
    }

    .browser-eye svg { width: 14px; height: 14px; }
    .browser-eye.off { color: #555; }
    .browser-eye:hover { color: #5be0a0; }

    .browser-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .browser-label.clickable { cursor: pointer; }
    .browser-label.dim { color: #777; }

    #sketch-plane-panel, #sketch-draw-panel {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.9);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    #sketch-plane-panel > *, #sketch-draw-panel > * { flex-shrink: 0; }

    #sketch-plane-panel button, #sketch-draw-panel button {
      font: 13px -apple-system, sans-serif;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #333;
      color: #eee;
      cursor: pointer;
    }

    .sketch-hint-inline { color: #999; }
    #sketch-tool-rect.active, #sketch-tool-polygon.active { background: #5be0a0; color: #103; border-color: #5be0a0; }
    #sketch-finish { background: #5be0a0; color: #103; border-color: #5be0a0; }
    #sketch-plane-cancel, #sketch-cancel { background: #444; }
    #sketch-draw-hint { color: #999; min-width: 12em; }

    #view-cube {
      position: fixed;
      top: 70px;
      right: 16px;
      width: 132px;
      height: 132px;
    }

    #view-cube canvas { cursor: pointer; }

    #view-cube-home {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 24px;
      height: 24px;
      border: none;
      background: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eee;
      cursor: pointer;
    }

    #view-cube-home:hover { color: #5be0a0; }
  </style>
</head>
<body>

  <div id="view-cube">
    <button id="view-cube-home" title="Reset to the default view">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      </svg>
    </button>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/STLLoader.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script>
    // M2 scope: a static viewport for one exported STL. No picking, no
    // timeline, no live engine connection yet — see docs/SPEC.md M3+.
    // Every colour written in this file is an sRGB hex, the way a CSS colour
    // or a design tool states it. The renderer's output encoding is sRGB (see
    // renderer setup below), so three.js treats a material colour as linear
    // light and encodes it on the way out. Passing a raw hex therefore
    // brightens it. srgb() does the one conversion that keeps what you write
    // and what you see the same. The view cube renders through cubeRenderer,
    // which has no output encoding, so its colours stay raw hexes.
    const srgb = (hex) => new THREE.Color(hex).convertSRGBToLinear();

    const scene = new THREE.Scene();
    // Not srgb(): r128 clears the framebuffer with this colour directly and
    // skips outputEncoding for it, so converting here would darken it twice.
    scene.background = new THREE.Color(0x1e1e1e);

    // Persistent outlines for sketch features: a bare sketch has no solid to
    // show (see sprocket_engine.cli._last_solid_index), so this outline is
    // its only visible trace until something extrudes it.
    const sketchOutlineGroup = new THREE.Group();
    scene.add(sketchOutlineGroup);

    // One entry per drawn sketch: { feature, line, fill, handles }. The fill is
    // an invisible mesh over the polygon, so a click inside the sketch picks
    // it. handles are the corner markers, shown only while it is selected.
    let sketchOutlines = [];

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.up.set(0, 0, 1); // Z-up, matching the engine's convention

    console.log("renderer init, size", window.innerWidth, window.innerHeight);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);
    console.log("renderer ready");

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // A studio rig, not a single lamp. The old ambient-plus-one-directional
    // pair summed to 1.4 on any face turned towards the key, so the body
    // colour's blue channel ran past 1.0 and clipped: every lit face came
    // back a flat #6ba5ff with no gradation left in it. These three sum to
    // 1.15 at most, and each comes from a different direction, so
    // neighbouring faces of a box read as different tones. Measured on
    // examples/box.json: face luminance now spans 0.24 to 0.48 with no
    // channel at 255. Before, it spanned 0.30 to 0.65 with the top faces
    // clipped. Fusion 360 spans 0.18 to 0.32 on the same shape, but it
    // separates faces with black edge lines rather than with light.
    const hemisphere = new THREE.HemisphereLight(0xffffff, 0x20242b, 0.18);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
    keyLight.position.set(2, -3, 4); // over the viewer's right shoulder
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.12);
    fillLight.position.set(-4, 1.5, 0.5); // opposite the key, to lift the shadow side
    scene.add(fillLight);

    const grid = new THREE.GridHelper(200, 20, 0x444444, 0x333333);
    grid.rotation.x = Math.PI / 2; // lie flat in the XY plane
    // GridHelper bakes its two colours into a vertex-colour attribute, so it
    // cannot take a srgb() Color. Convert the attribute in place instead.
    // r128 keeps its sRGB transfer function module-private, so inline it.
    const gridColors = grid.geometry.attributes.color.array;
    for (let i = 0; i < gridColors.length; i++) {
      const c = gridColors[i];
      gridColors[i] = c < 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }
    scene.add(grid);

    function frameCameraOn(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = size.length() * 0.6 || 50;

      camera.position.set(center.x + radius, center.y + radius, center.z + radius);
      camera.near = radius / 100;
      camera.far = radius * 100;
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    const params = new URLSearchParams(window.location.search);
    const partBase = params.get("part") || "part.stl";
    const featuresBase = "features.json";

    let mesh = null;
    let adjacency = null;

    function urlWithCacheBust(base, token) {
      if (!token) return base;
      return base + (base.includes("?") ? "&" : "?") + "t=" + token;
    }

    function loadPart(token, options) {
      const refit = Boolean(options && options.refit);
      const path = urlWithCacheBust(partBase, token);
      new THREE.STLLoader().load(
        path,
        (geometry) => {
          console.log("STL loaded", path);
          geometry.computeVertexNormals();
          // Replace, don't add: a rebuild reuses this scene instead of
          // reloading the page, so the old mesh must go or it doubles up.
          if (mesh) {
            scene.remove(mesh);
            mesh.geometry.dispose();
            mesh.material.dispose();
          }
          // metalness 0: a metal surface takes its colour from reflections,
          // and there is no environment map here, so any metalness above 0
          // only drains the body colour towards black.
          const material = new THREE.MeshStandardMaterial({ color: srgb(0x5b8dee), metalness: 0, roughness: 0.55 });
          mesh = new THREE.Mesh(geometry, material);
          scene.add(mesh);
          if (refit) frameCameraOn(mesh);
          adjacency = buildAdjacency(geometry);
          applyVisibility();
          renderBrowser();
        },
        undefined,
        (error) => {
          // Also fires for a genuinely empty document (rolled back before
          // the first feature): the engine deletes part.stl rather than
          // export nothing, so clear the stale mesh instead of leaving the
          // last-built part on screen.
          document.title = "Sprocket viewer";
          console.log("no part.stl to load (empty document, or a real load failure)", path, error);
          if (mesh) {
            scene.remove(mesh);
            mesh.geometry.dispose();
            mesh.material.dispose();
            mesh = null;
          }
          renderBrowser();
        }
      );
    }

    // --- Timeline (M3) --------------------------------------------------
    // A sidecar JSON next to part.stl, written by the Swift app on every
    // rebuild: a plain array of {id, type}, one per feature in the document.
    function loadFeatures(token) {
      fetch(urlWithCacheBust(featuresBase, token))
        // file:// fetches report status 0, not 200, so response.ok is always
        // false there — the same quirk STLLoader works around internally.
        .then((response) => (response.ok || response.status === 0 ? response.json() : []))
        .then((features) => {
          // A rebuild replaces every feature object, so a selection held from
          // before it would point at a stale one. The sketch selection is
          // re-resolved by id instead of dropped, so editing a corner leaves
          // the same sketch selected and its handles up for the next drag.
          browserFeatures = features;
          const selectedSketchID = selectedSketch && selectedSketch.id;
          selectedSketch = null;
          selectedPatch = null;
          hideSelectionPanel();
          hideStatus();
          renderTimeline(features);
          renderSketchOutlines(features);
          const stillThere = features.find(
            (feature) => feature.id === selectedSketchID && feature.type === "sketch" && feature.active
          );
          if (stillThere) selectSketchForExtrude(stillThere);
          reportFailedFeature(features);
          renderBrowser();
        })
        .catch((error) => console.error("failed to load features.json", error));
    }

    // Called from Swift (see WebView.swift) after every op edit, instead of
    // reloading the page: refetches part.stl/features.json in place so the
    // camera position and zoom the user set survive a rebuild.
    window.reloadPart = function (token) {
      loadPart(token, { refit: false });
      loadFeatures(token);
    };

    loadPart(params.get("t"), { refit: true });
    loadFeatures(params.get("t"));

    // A chip's click sets rollback_index: an active chip rolls back to just
    // before it; a greyed-out one rolls forward to just past it. Cmd+Z /
    // Cmd+Shift+Z undo/redo this and every extrude, via Swift's undo stack.
    const FEATURE_ICONS = {
      sketch:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21h8" /><path d="m15 5 4 4" /><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /></svg>',
      extrude:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6" /><path d="M12 3v14" /><path d="M5 21h14" /></svg>',
      extrude_face: "↕",
    };

    function renderTimeline(features) {
      const timeline = document.getElementById("timeline");
      timeline.innerHTML = "";
      features.forEach((feature, index) => {
        const chip = document.createElement("span");
        chip.className =
          "timeline-chip" + (feature.active ? "" : " timeline-chip-inactive") + (feature.failed ? " timeline-chip-failed" : "");
        chip.title = feature.failed ? feature.type + " - no longer applies" : feature.type;
        const icon = FEATURE_ICONS[feature.type] || "?";
        chip.innerHTML = '<span class="timeline-icon">' + icon + "</span>" + feature.id;
        chip.addEventListener("click", () => {
          // A sketch is inert (see cli.py's _last_solid_index) - clicking one
          // selects it, for extruding or for dragging its corners, instead of
          // rolling back to before it. Rolling back past a sketch shows the
          // same part, so the chip after it is the one that does that.
          if (feature.type === "sketch" && feature.active) {
            selectSketchForExtrude(feature);
            return;
          }
          setRollback(feature.active ? index : index + 1);
        });
        timeline.appendChild(chip);
      });
    }

    /// Names the op the engine could not apply, if any. Editing a sketch can
    /// leave a later op unbuildable - a face selector matching nothing, a cut
    /// that misses - and the part on screen is then the prefix before it, so
    /// the user has to be told rather than left wondering what vanished.
    function reportFailedFeature(features) {
      const failed = features.find((feature) => feature.failed);
      if (!failed) {
        warningEl.style.display = "none";
        return;
      }
      warningEl.textContent =
        failed.id + " (" + failed.type + ") no longer applies after the change. The part shown stops before it.";
      warningEl.style.display = "block";
    }

    function postToSwift(message) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sprocket) {
        window.webkit.messageHandlers.sprocket.postMessage(message);
        showStatus("Rebuilding…");
      } else {
        console.log("(no Swift bridge, browser preview)", message);
      }
    }

    function setRollback(index) {
      postToSwift({ type: "set_rollback", index: index });
    }

    // --- Push/pull picking (M3) ---------------------------------------
    // A "patch" is the set of triangles reachable from a clicked triangle
    // by crossing only shared edges into neighbours with the same normal
    // (within tolerance). That is one flat face, even when the STL split
    // it into several triangles.

    function vertexKey(pos, i) {
      // Round to make coincident vertices from different triangles compare
      // equal. STLLoader geometry is non-indexed, so there is no shared
      // index to rely on.
      return Math.round(pos.getX(i) * 1000) + "," + Math.round(pos.getY(i) * 1000) + "," + Math.round(pos.getZ(i) * 1000);
    }

    function buildAdjacency(geometry) {
      const pos = geometry.attributes.position;
      const triCount = pos.count / 3;
      const triEdges = [];
      const edgeMap = new Map(); // "keyA|keyB" -> [triIndex, ...]
      const keyToPos = new Map();

      for (let t = 0; t < triCount; t++) {
        const i0 = t * 3, i1 = t * 3 + 1, i2 = t * 3 + 2;
        const k0 = vertexKey(pos, i0), k1 = vertexKey(pos, i1), k2 = vertexKey(pos, i2);
        if (!keyToPos.has(k0)) keyToPos.set(k0, new THREE.Vector3(pos.getX(i0), pos.getY(i0), pos.getZ(i0)));
        if (!keyToPos.has(k1)) keyToPos.set(k1, new THREE.Vector3(pos.getX(i1), pos.getY(i1), pos.getZ(i1)));
        if (!keyToPos.has(k2)) keyToPos.set(k2, new THREE.Vector3(pos.getX(i2), pos.getY(i2), pos.getZ(i2)));

        const edges = [[k0, k1], [k1, k2], [k2, k0]];
        triEdges.push(edges);
        for (const [a, b] of edges) {
          const ek = a < b ? a + "|" + b : b + "|" + a;
          if (!edgeMap.has(ek)) edgeMap.set(ek, []);
          edgeMap.get(ek).push(t);
        }
      }

      const neighbours = Array.from({ length: triCount }, () => []);
      for (const tris of edgeMap.values()) {
        if (tris.length === 2) {
          neighbours[tris[0]].push(tris[1]);
          neighbours[tris[1]].push(tris[0]);
        }
      }

      return { triCount, triEdges, neighbours, keyToPos };
    }

    function triNormal(pos, t) {
      const i0 = t * 3, i1 = t * 3 + 1, i2 = t * 3 + 2;
      const a = new THREE.Vector3(pos.getX(i0), pos.getY(i0), pos.getZ(i0));
      const b = new THREE.Vector3(pos.getX(i1), pos.getY(i1), pos.getZ(i1));
      const c = new THREE.Vector3(pos.getX(i2), pos.getY(i2), pos.getZ(i2));
      return new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a)).normalize();
    }

    function floodFillPatch(startTri, pos) {
      const normal = triNormal(pos, startTri);
      const triangles = new Set([startTri]);
      const stack = [startTri];
      while (stack.length) {
        const t = stack.pop();
        for (const n of adjacency.neighbours[t]) {
          if (triangles.has(n)) continue;
          if (triNormal(pos, n).dot(normal) > 0.999) {
            triangles.add(n);
            stack.push(n);
          }
        }
      }
      return { triangles, normal };
    }

    function boundaryEdges(triangles) {
      const counts = new Map();
      for (const t of triangles) {
        for (const [a, b] of adjacency.triEdges[t]) {
          const ek = a < b ? a + "|" + b : b + "|" + a;
          counts.set(ek, (counts.get(ek) || 0) + 1);
        }
      }
      const edges = [];
      for (const t of triangles) {
        for (const [a, b] of adjacency.triEdges[t]) {
          const ek = a < b ? a + "|" + b : b + "|" + a;
          if (counts.get(ek) === 1) edges.push([a, b]);
        }
      }
      return edges;
    }

    // Walk the boundary edges into ordered loops, so consecutive vertices
    // are connected. Assumes simple faces with no holes, true for boxy parts.
    function orderLoops(edges) {
      const adj = new Map();
      for (const [a, b] of edges) {
        if (!adj.has(a)) adj.set(a, []);
        if (!adj.has(b)) adj.set(b, []);
        adj.get(a).push(b);
        adj.get(b).push(a);
      }
      const used = new Set();
      const loops = [];
      for (const [a, b] of edges) {
        const startKey = a < b ? a + "|" + b : b + "|" + a;
        if (used.has(startKey)) continue;
        used.add(startKey);
        const loop = [a];
        let cur = b;
        while (cur !== a) {
          loop.push(cur);
          const next = adj.get(cur).find((n) => {
            const ek = n < cur ? n + "|" + cur : cur + "|" + n;
            return !used.has(ek);
          });
          if (next === undefined) break;
          used.add(next < cur ? next + "|" + cur : cur + "|" + next);
          cur = next;
        }
        loops.push(loop);
      }
      return loops;
    }

    // Preview geometry: the patch itself, copied and pushed out along the
    // normal (the "cap"), plus a wall of quads connecting the original
    // boundary loop to its pushed-out copy. offsetFlags marks which
    // vertices move, so a drag only rewrites a position buffer - no rebuild.
    function buildPreviewArrays(patch, pos) {
      const positions = [];
      const offsets = [];

      for (const t of patch.triangles) {
        for (let k = 0; k < 3; k++) {
          const i = t * 3 + k;
          positions.push(pos.getX(i), pos.getY(i), pos.getZ(i));
          offsets.push(1);
        }
      }

      const loops = orderLoops(boundaryEdges(patch.triangles));
      for (const loop of loops) {
        for (let i = 0; i < loop.length; i++) {
          const a = adjacency.keyToPos.get(loop[i]);
          const b = adjacency.keyToPos.get(loop[(i + 1) % loop.length]);
          positions.push(a.x, a.y, a.z); offsets.push(0);
          positions.push(b.x, b.y, b.z); offsets.push(0);
          positions.push(b.x, b.y, b.z); offsets.push(1);
          positions.push(a.x, a.y, a.z); offsets.push(0);
          positions.push(b.x, b.y, b.z); offsets.push(1);
          positions.push(a.x, a.y, a.z); offsets.push(1);
        }
      }

      return { positions: new Float32Array(positions), offsets: new Float32Array(offsets) };
    }

    const raycaster = new THREE.Raycaster();
    const highlightMaterial = new THREE.MeshBasicMaterial({ color: srgb(0xffaa00), transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthTest: true });
    const highlightMesh = new THREE.Mesh(new THREE.BufferGeometry(), highlightMaterial);
    highlightMesh.visible = false;
    scene.add(highlightMesh);

    function setHighlight(patch, pos, color) {
      const positions = [];
      for (const t of patch.triangles) {
        for (let k = 0; k < 3; k++) {
          const i = t * 3 + k;
          // nudge along the normal so the highlight doesn't z-fight the mesh
          positions.push(
            pos.getX(i) + patch.normal.x * 0.05,
            pos.getY(i) + patch.normal.y * 0.05,
            pos.getZ(i) + patch.normal.z * 0.05
          );
        }
      }
      highlightMesh.geometry.dispose();
      highlightMesh.geometry = new THREE.BufferGeometry();
      highlightMesh.geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      highlightMaterial.color.copy(srgb(color));
      highlightMesh.visible = true;
    }

    function clearHighlight() {
      highlightMesh.visible = false;
    }

    /// A pointer event as normalised device coordinates, which is what
    /// Raycaster.setFromCamera takes.
    function pointerNDC(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      return new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -((event.clientY - rect.top) / rect.height) * 2 + 1
      );
    }

    function raycastFace(event) {
      if (!mesh || !mesh.visible) return null;
      raycaster.setFromCamera(pointerNDC(event), camera);
      const hits = raycaster.intersectObject(mesh);
      return hits.length ? hits[0] : null;
    }

    const hintEl = document.getElementById("hint");
    const panelEl = document.getElementById("extrude-panel");
    const distanceEl = document.getElementById("extrude-distance");
    const statusEl = document.getElementById("status");
    const warningEl = document.getElementById("warning");

    // --- Toolbar --------------------------------------------------------
    // Only three commands exist so far. Every other toolbar button is a
    // disabled placeholder, so the shape of the app is visible before the
    // ops behind it are written.
    const toolSketchEl = document.getElementById("tool-sketch");
    const toolExtrudeEl = document.getElementById("tool-extrude");

    /// Extrude acts on the current selection, so it is live only while there
    /// is one. Called from every place a selection or a mode changes.
    function updateToolbarState() {
      toolExtrudeEl.disabled = extrudeArmed || !(selectedPatch || selectedSketch);
      toolSketchEl.classList.toggle("active", Boolean(sketchStage));
    }

    toolSketchEl.addEventListener("click", () => {
      if (sketchStage || extrudeArmed) return;
      startSketchPickPlane();
    });

    toolExtrudeEl.addEventListener("click", armCurrentSelection);

    // Clears the document to zero features. No confirmation, because Swift
    // snapshots box.json into the same undo stack every other edit uses, so
    // Cmd+Z brings the whole part back (see ContentView.performMutation).
    document.getElementById("tool-new").addEventListener("click", () => {
      if (sketchStage || extrudeArmed) return;
      postToSwift({ type: "new_document" });
    });

    // --- Browser tree ---------------------------------------------------
    // Visibility only, for now. The state lives here rather than on the
    // three.js objects because a rebuild replaces every sketch object and
    // the mesh: feature ids outlive them, the objects do not.
    const hiddenSketchIDs = new Set();
    const collapsedGroups = new Set();
    let bodyVisible = true;
    let gridVisible = true;
    let browserFeatures = [];

    const EYE_ON =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg>';
    const EYE_OFF =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></svg>';

    /// Pushes the browser tree's state onto the scene. Runs after every
    /// rebuild too, since renderSketchOutlines makes new objects that default
    /// to visible.
    function applyVisibility() {
      grid.visible = gridVisible;
      if (mesh) mesh.visible = bodyVisible;
      sketchOutlines.forEach((entry) => {
        const visible = !hiddenSketchIDs.has(entry.feature.id);
        entry.line.visible = visible;
        // The fill is the click target (see raycastSketch), so hiding it is
        // also what makes a hidden sketch unpickable in the viewport.
        entry.fill.visible = visible;
        if (!visible) entry.handles.visible = false;
      });
    }

    // Hiding the selected sketch keeps it selected, as Fusion does. Its
    // corner handles go with it, and pickSketchPart refuses to grab a hidden
    // outline, so the only thing left is Extrude.
    function setSketchHidden(id, hidden) {
      if (hidden) hiddenSketchIDs.add(id);
      else hiddenSketchIDs.delete(id);
      applyVisibility();
      renderBrowser();
    }

    function visibleSketches() {
      return browserFeatures.filter(
        (feature) => feature.type === "sketch" && feature.plane && feature.polygon && !hiddenSketchIDs.has(feature.id)
      );
    }

    function setEverythingVisible(visible) {
      gridVisible = visible;
      bodyVisible = visible;
      hiddenSketchIDs.clear();
      if (!visible) {
        browserFeatures
          .filter((feature) => feature.type === "sketch")
          .forEach((feature) => hiddenSketchIDs.add(feature.id));
      }
      applyVisibility();
      renderBrowser();
    }

    function toggleGroup(name) {
      if (collapsedGroups.has(name)) collapsedGroups.delete(name);
      else collapsedGroups.add(name);
      renderBrowser();
    }

    function renderBrowser() {
      const tree = document.getElementById("browser-tree");
      tree.innerHTML = "";

      function addRow(options) {
        const row = document.createElement("div");
        row.className = "browser-row" + (options.selected ? " selected" : "");
        row.style.paddingLeft = 6 + options.depth * 14 + "px";

        const caret = document.createElement("span");
        caret.className = "browser-caret" + (options.group ? " clickable" : "");
        caret.textContent = options.group ? (collapsedGroups.has(options.group) ? "▸" : "▾") : "";
        if (options.group) caret.addEventListener("click", () => toggleGroup(options.group));
        row.appendChild(caret);

        const eye = document.createElement("span");
        eye.className = "browser-eye" + (options.visible ? "" : " off");
        eye.innerHTML = options.visible ? EYE_ON : EYE_OFF;
        eye.title = options.visible ? "Hide" : "Show";
        eye.addEventListener("click", options.onToggle);
        row.appendChild(eye);

        const label = document.createElement("span");
        label.className = "browser-label" + (options.onClick ? " clickable" : "") + (options.dim ? " dim" : "");
        label.textContent = options.label;
        if (options.onClick) label.addEventListener("click", options.onClick);
        row.appendChild(label);

        tree.appendChild(row);
      }

      const sketches = browserFeatures.filter(
        (feature) => feature.type === "sketch" && feature.plane && feature.polygon
      );
      const anythingVisible = gridVisible || (Boolean(mesh) && bodyVisible) || visibleSketches().length > 0;

      addRow({
        depth: 0,
        group: "root",
        label: "Document",
        visible: anythingVisible,
        onToggle: () => setEverythingVisible(!anythingVisible),
      });
      if (collapsedGroups.has("root")) return;

      addRow({
        depth: 1,
        label: "Grid",
        visible: gridVisible,
        onToggle: () => {
          gridVisible = !gridVisible;
          applyVisibility();
          renderBrowser();
        },
      });

      addRow({
        depth: 1,
        group: "bodies",
        label: "Bodies",
        dim: !mesh,
        visible: Boolean(mesh) && bodyVisible,
        onToggle: () => {
          if (!mesh) return;
          bodyVisible = !bodyVisible;
          applyVisibility();
          renderBrowser();
        },
      });
      // One STL means one body. Split this when the engine exports more.
      if (mesh && !collapsedGroups.has("bodies")) {
        addRow({
          depth: 2,
          label: "Body1",
          visible: bodyVisible,
          onToggle: () => {
            bodyVisible = !bodyVisible;
            applyVisibility();
            renderBrowser();
          },
        });
      }

      addRow({
        depth: 1,
        group: "sketches",
        label: "Sketches",
        dim: sketches.length === 0,
        visible: visibleSketches().length > 0,
        onToggle: () => {
          const showing = visibleSketches().length > 0;
          sketches.forEach((feature) => setSketchHidden(feature.id, showing));
        },
      });
      if (collapsedGroups.has("sketches")) return;
      sketches.forEach((feature) => {
        const hidden = hiddenSketchIDs.has(feature.id);
        addRow({
          depth: 2,
          label: feature.id,
          // A rolled-past sketch is greyed in the timeline too: it is not part
          // of the document prefix the build replayed.
          dim: !feature.active,
          selected: Boolean(selectedSketch && selectedSketch.id === feature.id),
          visible: !hidden,
          onToggle: () => setSketchHidden(feature.id, !hidden),
          onClick: feature.active && !hidden ? () => selectSketchForExtrude(feature) : null,
        });
      });
    }

    function showHint(text) { hintEl.textContent = text; hintEl.style.display = "block"; }
    function hideHint() { hintEl.style.display = "none"; }

    // The panel that turns a selection into an extrude. Selecting used to
    // show a "Press E" hint only, which left no visible way in for anyone
    // who didn't know the shortcut.
    const selectionPanelEl = document.getElementById("selection-panel");
    const selectionLabelEl = document.getElementById("selection-label");

    function showSelectionPanel(label) {
      selectionLabelEl.textContent = label;
      selectionPanelEl.style.display = "flex";
      updateToolbarState();
      renderBrowser();
    }

    function hideSelectionPanel() {
      selectionPanelEl.style.display = "none";
      updateToolbarState();
      renderBrowser();
    }

    /// Arms whichever of the two selections is live. The E key and the
    /// panel's Extrude button both come through here.
    function armCurrentSelection() {
      if (extrudeArmed) return;
      if (selectedPatch) armExtrude();
      else if (selectedSketch) armSketchExtrude(selectedSketch);
    }

    function clearSelection() {
      selectedPatch = null;
      selectedSketch = null;
      renderer.domElement.style.cursor = "default";
      clearHighlight();
      hideSelectionPanel();
      hideHint();
      renderSketchSelection();
    }
    function showStatus(text) { statusEl.textContent = text; statusEl.style.display = "block"; }
    // The rebuild this was showing has landed: features.json is what arrives
    // last, so loadFeatures clears it.
    function hideStatus() { statusEl.style.display = "none"; }

    let selectedPatch = null; // { triangles, normal, anchorPoint }
    let selectedSketch = null; // a features.json entry: any replayed sketch, picked in the 3D view or via its timeline chip
    // A live corner or edge drag on the selected sketch:
    // { feature, plane, kind, indices, polygon, lastUV }. polygon is a working
    // copy in the plane's uv, posted to Swift on release.
    let sketchEditDrag = null;
    let extrudeArmed = false;
    let armedMode = "face"; // "face" | "sketch" - which of the two below armExtrude() armed
    let dragLocked = false; // true once the user clicks to fix the distance, before OK
    let distanceTyped = false; // the user typed into the distance box, so the drag stops writing to it
    let previewState = null; // { basePositions, offsetFlags, previewMesh, previewGeometry, dragPlane, distance }
    let sketchExtrudeFeature = null; // the features.json entry armSketchExtrude() is dragging
    let sketchExtrudeAxis = null; // THREE.Vector3, the sketch plane's normal
    let sketchExtrudeAnchor = null; // THREE.Vector3, the sketch polygon's centroid

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (sketchStage === "draw") {
        handleSketchHover(event);
        return;
      }
      if (sketchStage === "pick-plane") {
        if (!mesh) {
          clearHighlight();
          return;
        }
        const hit = raycastFace(event);
        if (!hit) {
          clearHighlight();
          return;
        }
        const patch = floodFillPatch(hit.faceIndex, mesh.geometry.attributes.position);
        setHighlight(patch, mesh.geometry.attributes.position, 0xffaa00);
        return;
      }
      if (sketchEditDrag) {
        dragSketchEdit(event);
        return;
      }
      if (extrudeArmed) {
        if (!dragLocked) updateDragDistance(event);
        return;
      }
      // A grab cursor over a corner or an edge of the selected sketch: the only
      // cue, besides the corner markers, that it can be dragged.
      renderer.domElement.style.cursor =
        selectedSketch && pickSketchPart(event, selectedSketch) ? "move" : "default";
      if (selectedPatch) return; // keep the selection highlight until a new pick
      const hit = raycastFace(event);
      if (!hit) {
        clearHighlight();
        return;
      }
      const patch = floodFillPatch(hit.faceIndex, mesh.geometry.attributes.position);
      setHighlight(patch, mesh.geometry.attributes.position, 0xffaa00);
    });

    // Grabbing the viewport cancels a camera move, unless the move is the one
    // that puts you square on to a sketch plane.
    function cancelCameraMove() {
      if (controls.enableRotate) cameraMove = null;
    }
    renderer.domElement.addEventListener("pointerdown", cancelCameraMove);
    renderer.domElement.addEventListener("wheel", cancelCameraMove, { passive: true });

    renderer.domElement.addEventListener("pointerdown", (event) => {
      if (sketchStage === "pick-plane") {
        const hit = raycastFace(event);
        if (!hit) return;
        const pos = mesh.geometry.attributes.position;
        const patch = floodFillPatch(hit.faceIndex, pos);
        sketchPlane = makeSketchPlane(hit.point, patch.normal, computeXDir(patch.normal));
        enterSketchDrawStage();
        return;
      }
      if (sketchStage === "draw") {
        handleSketchClick(event);
        return;
      }
      if (extrudeArmed && !dragLocked) {
        dragLocked = true; // click lets go of the drag; the box, OK and Cancel take it from here
        distanceEl.value = previewState.distance.toFixed(2) + " mm";
        return;
      }
      if (extrudeArmed) return; // already locked - the box, OK and Cancel decide the outcome
      // Editing the selected sketch outranks picking anything new: a press on
      // one of its corners or edges starts a drag rather than a reselection.
      if (selectedSketch) {
        const pick = pickSketchPart(event, selectedSketch);
        if (pick) {
          beginSketchEdit(pick);
          return;
        }
      }
      // The sketch is tested first: its outline sits on the part surface, so a
      // face hit at the same pixel would otherwise always win.
      const sketch = raycastSketch(event);
      if (sketch) {
        selectSketchForExtrude(sketch);
        return;
      }
      const hit = raycastFace(event);
      if (!hit) {
        clearSelection();
        return;
      }
      const pos = mesh.geometry.attributes.position;
      const patch = floodFillPatch(hit.faceIndex, pos);
      selectedPatch = { triangles: patch.triangles, normal: patch.normal, anchorPoint: hit.point.clone() };
      selectedSketch = null;
      setHighlight(selectedPatch, pos, 0xffdd55);
      renderSketchSelection();
      hideHint();
      showSelectionPanel("Face selected");
    });

    // Ends a corner or edge drag and sends the new profile to Swift, which
    // rewrites the sketch in place and replays everything after it (see
    // ContentView's updateSketchPolygon). Not on the canvas: releasing outside
    // it would otherwise leave the drag live.
    window.addEventListener("pointerup", () => {
      if (!sketchEditDrag) return;
      const { feature, polygon } = sketchEditDrag;
      sketchEditDrag = null;
      controls.enabled = true;
      hideHint();
      postToSwift({ type: "update_sketch", id: feature.id, polygon: polygon });
    });

    // Selects a sketch feature, from a click on the sketch in the 3D view or on
    // its timeline chip. A selected sketch is what E extrudes, and what a
    // corner or edge drag edits - the user's own rule is "a sketch stays flat
    // until you select it and choose extrude."
    function selectSketchForExtrude(feature) {
      if (extrudeArmed) return;
      selectedSketch = feature;
      selectedPatch = null;
      clearHighlight();
      renderSketchSelection();
      hideHint();
      showSelectionPanel("Sketch " + feature.id + " selected, drag a corner or edge to change it");
    }

    // How close, in screen pixels, the pointer must be to a corner or an edge
    // to grab it. In pixels rather than mm so it holds at any zoom.
    const SKETCH_PICK_PIXELS = 10;

    /// Where the pointer sits on `plane`, in the plane's own [u, v], or null
    /// when the ray runs parallel to it. The plane is infinite on purpose: a
    /// corner can be dragged outside the polygon it belongs to.
    function pointerOnSketchPlane(event, plane) {
      raycaster.setFromCamera(pointerNDC(event), camera);
      const normal = new THREE.Vector3().crossVectors(plane.xDir, plane.yDir).normalize();
      const hit = new THREE.Vector3();
      const infinite = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, plane.origin);
      if (!raycaster.ray.intersectPlane(infinite, hit)) return null;
      const local = hit.sub(plane.origin);
      return [local.dot(plane.xDir), local.dot(plane.yDir)];
    }

    /// SKETCH_PICK_PIXELS as a distance in mm at `point`. A pick radius fixed
    /// in mm would be unreachable zoomed out and swallow the whole sketch
    /// zoomed in.
    function worldRadius(pixels, point) {
      const viewDistance = camera.position.distanceTo(point);
      const worldPerPixel =
        (2 * Math.tan((camera.fov * Math.PI) / 360) * viewDistance) / renderer.domElement.clientHeight;
      return pixels * worldPerPixel;
    }

    function pointToSegment([px, py], [ax, ay], [bx, by]) {
      const dx = bx - ax;
      const dy = by - ay;
      const lengthSq = dx * dx + dy * dy;
      const t = lengthSq ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lengthSq)) : 0;
      return Math.hypot(px - ax - t * dx, py - ay - t * dy);
    }

    /// What the pointer is over on `feature`'s outline: { kind, indices, uv,
    /// plane } for a corner or an edge, else null. Corners win over edges at
    /// equal distance, since a corner sits on two of them.
    function pickSketchPart(event, feature) {
      if (!feature.plane || !feature.polygon) return null;
      if (hiddenSketchIDs.has(feature.id)) return null;
      const plane = resolveStoredPlane(feature.plane);
      const uv = pointerOnSketchPlane(event, plane);
      if (!uv) return null;
      const world = plane.origin.clone().addScaledVector(plane.xDir, uv[0]).addScaledVector(plane.yDir, uv[1]);
      const polygon = feature.polygon;

      let best = { distance: worldRadius(SKETCH_PICK_PIXELS, world), kind: null, indices: null };
      polygon.forEach(([u, v], index) => {
        const distance = Math.hypot(u - uv[0], v - uv[1]);
        if (distance < best.distance) best = { distance, kind: "corner", indices: [index] };
      });
      if (!best.kind) {
        polygon.forEach((_, index) => {
          const next = (index + 1) % polygon.length;
          const distance = pointToSegment(uv, polygon[index], polygon[next]);
          if (distance < best.distance) best = { distance, kind: "edge", indices: [index, next] };
        });
      }
      return best.kind ? { kind: best.kind, indices: best.indices, uv: uv, plane: plane } : null;
    }

    function beginSketchEdit(pick) {
      sketchEditDrag = {
        feature: selectedSketch,
        plane: pick.plane,
        kind: pick.kind,
        indices: pick.indices,
        polygon: selectedSketch.polygon.map(([u, v]) => [u, v]),
        lastUV: pick.uv,
      };
      controls.enabled = false;
      showHint(pick.kind === "corner" ? "Dragging a corner" : "Dragging an edge");
    }

    function dragSketchEdit(event) {
      const uv = pointerOnSketchPlane(event, sketchEditDrag.plane);
      if (!uv) return;
      let du = uv[0] - sketchEditDrag.lastUV[0];
      let dv = uv[1] - sketchEditDrag.lastUV[1];
      if (sketchEditDrag.kind === "edge") {
        // An edge moves perpendicular to itself, so it stays parallel and a
        // dragged rectangle stays a rectangle. Dragging along the edge does
        // nothing, the same as in Fusion.
        const [a, b] = sketchEditDrag.indices.map((index) => sketchEditDrag.polygon[index]);
        const length = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (length > 1e-9) {
          const nu = -(b[1] - a[1]) / length;
          const nv = (b[0] - a[0]) / length;
          const along = du * nu + dv * nv;
          du = along * nu;
          dv = along * nv;
        }
      }
      sketchEditDrag.indices.forEach((index) => {
        sketchEditDrag.polygon[index][0] += du;
        sketchEditDrag.polygon[index][1] += dv;
      });
      sketchEditDrag.lastUV = uv;
      redrawSketchEdit();
    }

    /// Redraws the dragged sketch from its working polygon, so the outline and
    /// its handles follow the pointer before the engine has rebuilt anything.
    /// The invisible fill is left stale: nothing raycasts it mid-drag, and the
    /// rebuild rebuilds it anyway.
    function redrawSketchEdit() {
      const entry = sketchOutlines.find(({ feature }) => feature.id === sketchEditDrag.feature.id);
      if (!entry) return;
      const { plane, polygon } = sketchEditDrag;
      const points = polygon.map(([u, v]) =>
        plane.origin.clone().addScaledVector(plane.xDir, u).addScaledVector(plane.yDir, v)
      );
      entry.line.geometry.dispose();
      entry.line.geometry = new THREE.BufferGeometry().setFromPoints(points.concat([points[0]]));
      entry.handles.geometry.dispose();
      entry.handles.geometry = new THREE.BufferGeometry().setFromPoints(points);
    }

    function armExtrude() {
      armedMode = "face";
      const axis = selectedPatch.normal;
      const anchor = selectedPatch.anchorPoint;
      const cameraToAnchor = anchor.clone().sub(camera.position).normalize();
      let planeNormal = new THREE.Vector3().crossVectors(axis, cameraToAnchor).cross(axis);
      if (planeNormal.lengthSq() < 1e-6) {
        planeNormal = new THREE.Vector3();
        camera.getWorldDirection(planeNormal);
      }
      planeNormal.normalize();
      const dragPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, anchor);

      const pos = mesh.geometry.attributes.position;
      const { positions: basePositions, offsets: offsetFlags } = buildPreviewArrays(selectedPatch, pos);
      const previewGeometry = new THREE.BufferGeometry();
      previewGeometry.setAttribute("position", new THREE.Float32BufferAttribute(basePositions.slice(), 3));
      const previewMaterial = new THREE.MeshStandardMaterial({ color: srgb(0x5be0a0), transparent: true, opacity: 0.55, side: THREE.DoubleSide });
      const previewMesh = new THREE.Mesh(previewGeometry, previewMaterial);
      scene.add(previewMesh);

      previewState = { basePositions, offsetFlags, previewMesh, previewGeometry, dragPlane, distance: 0.01 };
      extrudeArmed = true;
      dragLocked = false;
      distanceTyped = false;
      controls.enabled = false;
      hideHint();
      hideSelectionPanel();
      panelEl.style.display = "flex";
      updatePreviewGeometry(previewState.distance);
      focusDistanceBox();
    }

    // Arms extrude for a selected sketch (see selectSketchForExtrude): the
    // same drag-to-set-distance interaction as armExtrude(), but there's no
    // mesh patch to push - the "face" is the sketch's own flat polygon, and
    // its normal is the sketch plane's normal.
    function armSketchExtrude(feature) {
      armedMode = "sketch";
      const plane = resolveStoredPlane(feature.plane);
      const axis = new THREE.Vector3().crossVectors(plane.xDir, plane.yDir).normalize();
      const anchor = feature.polygon
        .reduce((sum, [u, v]) => sum.add(plane.origin.clone().addScaledVector(plane.xDir, u).addScaledVector(plane.yDir, v)), new THREE.Vector3())
        .divideScalar(feature.polygon.length);

      const cameraToAnchor = anchor.clone().sub(camera.position).normalize();
      let planeNormal = new THREE.Vector3().crossVectors(axis, cameraToAnchor).cross(axis);
      if (planeNormal.lengthSq() < 1e-6) {
        planeNormal = new THREE.Vector3();
        camera.getWorldDirection(planeNormal);
      }
      planeNormal.normalize();
      const dragPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, anchor);

      const previewMaterial = new THREE.MeshStandardMaterial({ color: srgb(0x5be0a0), transparent: true, opacity: 0.55, side: THREE.DoubleSide });
      const previewMesh = new THREE.Mesh(new THREE.BufferGeometry(), previewMaterial);
      scene.add(previewMesh);

      sketchExtrudeFeature = feature;
      sketchExtrudeAxis = axis;
      sketchExtrudeAnchor = anchor;
      previewState = { previewMesh, previewGeometry: previewMesh.geometry, dragPlane, distance: 0.01 };
      extrudeArmed = true;
      dragLocked = false;
      distanceTyped = false;
      controls.enabled = false;
      hideHint();
      hideSelectionPanel();
      panelEl.style.display = "flex";
      updateSketchPreviewGeometry(previewState.distance);
      focusDistanceBox();
    }

    /// Puts the caret in the distance box on arm, so a typed value needs no
    /// click first. Selected, so the first keystroke replaces the drag's value.
    function focusDistanceBox() {
      distanceEl.focus();
      distanceEl.select();
    }

    // Builds a prism from the sketch's own polygon, extruded along its plane
    // normal by `distance` (negative goes the other way, previewing a cut).
    function buildSketchExtrudePreviewGeometry(feature, distance) {
      const plane = resolveStoredPlane(feature.plane);
      const shape = new THREE.Shape(feature.polygon.map(([u, v]) => new THREE.Vector2(u, v)));
      const depth = Math.max(Math.abs(distance), 0.001);
      const geometry = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 1 });
      if (distance < 0) geometry.translate(0, 0, -depth);
      const normal = new THREE.Vector3().crossVectors(plane.xDir, plane.yDir).normalize();
      const basis = new THREE.Matrix4().makeBasis(plane.xDir, plane.yDir, normal);
      basis.setPosition(plane.origin);
      geometry.applyMatrix4(basis);
      return geometry;
    }

    function updateSketchPreviewGeometry(distance) {
      const geometry = buildSketchExtrudePreviewGeometry(sketchExtrudeFeature, distance);
      previewState.previewMesh.geometry.dispose();
      previewState.previewMesh.geometry = geometry;
      previewState.previewGeometry = geometry;
      previewState.distance = distance;
      showDistance(distance);
    }

    function updatePreviewGeometry(distance) {
      const { basePositions, offsetFlags, previewGeometry } = previewState;
      const arr = previewGeometry.attributes.position.array;
      const axis = selectedPatch.normal;
      for (let i = 0; i < offsetFlags.length; i++) {
        const o = offsetFlags[i] * distance;
        arr[i * 3] = basePositions[i * 3] + axis.x * o;
        arr[i * 3 + 1] = basePositions[i * 3 + 1] + axis.y * o;
        arr[i * 3 + 2] = basePositions[i * 3 + 2] + axis.z * o;
      }
      previewGeometry.attributes.position.needsUpdate = true;
      previewGeometry.computeVertexNormals();
      previewState.distance = distance;
      showDistance(distance);
    }

    /// Writes the drag's distance into the box, unless the user has typed a
    /// value there - reformatting what someone is halfway through typing would
    /// fight them for the caret.
    function showDistance(distance) {
      if (distanceTyped) return;
      distanceEl.value = distance.toFixed(2) + " mm";
    }

    /// Reads "2 mm", "3.2" or "-3" as a number of millimetres. parseFloat
    /// stops at the unit suffix, so no unit parsing of our own is needed.
    /// Returns null for anything with no leading number, including "".
    function parseDistance(text) {
      const value = parseFloat(text);
      return Number.isFinite(value) ? value : null;
    }

    /// Applies what is in the distance box to the live preview. Typing takes
    /// the distance over from the mouse, the same way clicking does.
    function applyTypedDistance() {
      if (!extrudeArmed) return;
      const value = parseDistance(distanceEl.value);
      if (value === null) return;
      distanceTyped = true;
      dragLocked = true;
      if (armedMode === "sketch") updateSketchPreviewGeometry(value); else updatePreviewGeometry(value);
    }

    distanceEl.addEventListener("input", applyTypedDistance);

    function updateDragDistance(event) {
      raycaster.setFromCamera(pointerNDC(event), camera);
      const hit = new THREE.Vector3();
      if (!raycaster.ray.intersectPlane(previewState.dragPlane, hit)) return;
      const anchor = armedMode === "sketch" ? sketchExtrudeAnchor : selectedPatch.anchorPoint;
      const axis = armedMode === "sketch" ? sketchExtrudeAxis : selectedPatch.normal;
      let distance = hit.clone().sub(anchor).dot(axis);
      // clamp away from zero, not to a positive floor - dragging past the
      // anchor point pushes inward and should cut, not floor out at 0.01.
      if (Math.abs(distance) < 0.01) distance = distance < 0 ? -0.01 : 0.01;
      if (armedMode === "sketch") updateSketchPreviewGeometry(distance); else updatePreviewGeometry(distance);
    }

    function cancelExtrude() {
      scene.remove(previewState.previewMesh);
      previewState.previewGeometry.dispose();
      previewState.previewMesh.material.dispose();
      previewState = null;
      extrudeArmed = false;
      armedMode = "face";
      sketchExtrudeFeature = null;
      dragLocked = false;
      distanceTyped = false;
      controls.enabled = true;
      panelEl.style.display = "none";
      distanceEl.blur();
      updateToolbarState();
    }

    function commitExtrude() {
      const message = armedMode === "sketch"
        ? { type: "extrude_sketch", profile: sketchExtrudeFeature.id, distance: previewState.distance }
        : { type: "extrude_face", point: selectedPatch.anchorPoint.toArray(), normal: selectedPatch.normal.toArray(), distance: previewState.distance };
      cancelExtrude();
      postToSwift(message);
    }

    document.getElementById("extrude-ok").addEventListener("click", () => { if (extrudeArmed) commitExtrude(); });
    document.getElementById("extrude-cancel").addEventListener("click", () => { if (extrudeArmed) cancelExtrude(); });

    document.getElementById("selection-extrude").addEventListener("click", armCurrentSelection);
    document.getElementById("selection-cancel").addEventListener("click", clearSelection);

    window.addEventListener("keydown", (event) => {
      if (sketchStage) {
        if (event.key === "Escape") {
          cancelSketch();
        } else if (event.key === "Enter" && sketchTool === "polygon" && sketchPoints.length >= 3) {
          finishSketch(sketchPoints);
        }
        return;
      }
      // Typing in the distance box must not trigger shortcuts: "e" would
      // re-arm and "s" would start a sketch. Enter and Escape still count,
      // since they commit and cancel from the keyboard.
      if (document.activeElement === distanceEl && event.key !== "Enter" && event.key !== "Escape") {
        return;
      }
      if ((event.key === "s" || event.key === "S") && !extrudeArmed) {
        startSketchPickPlane();
      } else if (event.key === "e" || event.key === "E") {
        // Stops the "e" itself landing in the distance box, which arming focuses.
        event.preventDefault();
        armCurrentSelection();
      } else if (event.key === "Escape" && !extrudeArmed) {
        clearSelection();
      } else if (event.key === "Escape" && extrudeArmed) {
        cancelExtrude();
      } else if (event.key === "Enter" && extrudeArmed) {
        commitExtrude();
      } else if (event.metaKey && event.key.toLowerCase() === "z" && !extrudeArmed) {
        event.preventDefault();
        postToSwift({ type: event.shiftKey ? "redo" : "undo" });
      }
    });

    // --- Sketch mode -----------------------------------------------------
    // Two stages: "pick-plane" (click a face, or one of the three principal
    // planes) then "draw" (place a rectangle or freeform polygon on that
    // plane). On finish, world-space points are projected into the plane's
    // own [u, v] basis and posted as {type: "add_sketch", plane, polygon} -
    // see sketch.py's PLANE_SCHEMA for the exact shape `plane` must match.
    const SKETCH_PRINCIPAL_PLANES = {
      // Bases match build123d's own Plane.XY/XZ/YZ exactly (confirmed
      // against the engine): y_dir is always normal.cross(x_dir).
      XY: { origin: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, 0, 1), xDir: new THREE.Vector3(1, 0, 0) },
      XZ: { origin: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(0, -1, 0), xDir: new THREE.Vector3(1, 0, 0) },
      YZ: { origin: new THREE.Vector3(0, 0, 0), normal: new THREE.Vector3(1, 0, 0), xDir: new THREE.Vector3(0, 1, 0) },
    };

    let sketchStage = null; // null | "pick-plane" | "draw"
    let sketchPlane = null; // { origin, normal, xDir, yDir, ref } - ref is "XY"/"XZ"/"YZ" or null for a picked face
    let sketchTool = "rect"; // "rect" | "polygon"
    let sketchPoints = []; // Vector3[], world-space, placed so far
    let sketchHoverPoint = null;
    let sketchPlaneHelper = null;
    let sketchPreviewLine = null;
    let dimmedMeshState = null; // { transparent, opacity } to restore on exit

    const sketchPlanePanelEl = document.getElementById("sketch-plane-panel");
    const sketchDrawPanelEl = document.getElementById("sketch-draw-panel");
    const sketchDrawHintEl = document.getElementById("sketch-draw-hint");
    const sketchToolRectEl = document.getElementById("sketch-tool-rect");
    const sketchToolPolygonEl = document.getElementById("sketch-tool-polygon");

    // A picked face only gives a normal, not an in-plane x-axis, so one is
    // built the same way for JS and Python: cross world-up into the normal,
    // falling back to world-X when the normal is nearly vertical.
    function computeXDir(normal) {
      const worldUp = new THREE.Vector3(0, 0, 1);
      const ref = Math.abs(normal.dot(worldUp)) > 0.9 ? new THREE.Vector3(1, 0, 0) : worldUp;
      return new THREE.Vector3().crossVectors(ref, normal).normalize();
    }

    function makeSketchPlane(origin, normal, xDir) {
      const unitNormal = normal.clone().normalize();
      const unitXDir = xDir.clone().normalize();
      const yDir = new THREE.Vector3().crossVectors(unitNormal, unitXDir).normalize();
      return { origin: origin.clone(), normal: unitNormal, xDir: unitXDir, yDir, ref: null };
    }

    function sketchToLocal(point) {
      const rel = point.clone().sub(sketchPlane.origin);
      return [rel.dot(sketchPlane.xDir), rel.dot(sketchPlane.yDir)];
    }

    function sketchToWorld(u, v) {
      return sketchPlane.origin.clone().addScaledVector(sketchPlane.xDir, u).addScaledVector(sketchPlane.yDir, v);
    }

    // Rebuilds a plane basis from a stored sketch feature's `plane` field -
    // same shapes finishSketch() posts to Swift (a principal-plane name, or a
    // {origin, normal, x_dir} dict), so a persisted sketch renders with the
    // same basis it was drawn on.
    function resolveStoredPlane(planeRef) {
      if (typeof planeRef === "string") {
        const base = SKETCH_PRINCIPAL_PLANES[planeRef];
        return { origin: base.origin.clone(), xDir: base.xDir.clone(), yDir: base.normal.clone().cross(base.xDir).normalize() };
      }
      const origin = new THREE.Vector3(...planeRef.origin);
      const normal = new THREE.Vector3(...planeRef.normal).normalize();
      const xDir = new THREE.Vector3(...planeRef.x_dir).normalize();
      return { origin, xDir, yDir: new THREE.Vector3().crossVectors(normal, xDir).normalize() };
    }

    // Draws a closed outline for every sketch feature in the timeline, since
    // a bare sketch has no solid of its own to show. Rebuilt wholesale on
    // every features.json load - cheap, and simpler than diffing.
    function renderSketchOutlines(features) {
      sketchOutlineGroup.clear();
      sketchOutlines = [];
      features
        .filter((feature) => feature.type === "sketch" && feature.plane && feature.polygon)
        .forEach((feature) => {
          const plane = resolveStoredPlane(feature.plane);
          const points = feature.polygon.map(([u, v]) => plane.origin.clone().addScaledVector(plane.xDir, u).addScaledVector(plane.yDir, v));
          points.push(points[0]);
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          // A sketch drawn on an existing face sits exactly on the mesh
          // surface, which z-fights with a normal line. depthTest off plus a
          // high renderOrder draws it on top unconditionally instead, so it
          // stays visible regardless of camera angle - the user's explicit
          // requirement for a bare, unextruded sketch.
          const material = new THREE.LineBasicMaterial({ color: srgb(feature.active ? 0x5be0a0 : 0x666666), depthTest: false });
          const line = new THREE.Line(geometry, material);
          line.renderOrder = 999;
          sketchOutlineGroup.add(line);

          // An invisible fill over the same polygon, so a click anywhere
          // inside the sketch picks it. Raycasting the outline alone would
          // need pixel-accurate aim along a 1px line.
          const shape = new THREE.Shape(feature.polygon.map(([u, v]) => new THREE.Vector2(u, v)));
          const fillGeometry = new THREE.ShapeGeometry(shape);
          // Baked into the geometry rather than set as the mesh's matrix, so
          // raycasting needs no matrixWorld update pass to see it.
          fillGeometry.applyMatrix4(
            new THREE.Matrix4()
              .makeBasis(plane.xDir, plane.yDir, new THREE.Vector3().crossVectors(plane.xDir, plane.yDir).normalize())
              .setPosition(plane.origin)
          );
          const fill = new THREE.Mesh(fillGeometry, new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide }));
          sketchOutlineGroup.add(fill);

          // Corner markers, shown only while the sketch is selected. They are
          // the visible cue that a corner can be dragged; the hit test itself
          // works in the plane's uv (see pickSketchPart), not off these points.
          // Fixed pixel size, so they stay grabbable at any zoom.
          const handles = new THREE.Points(
            new THREE.BufferGeometry().setFromPoints(points.slice(0, -1)),
            new THREE.PointsMaterial({ color: 0xffdd55, size: 8, sizeAttenuation: false, depthTest: false })
          );
          handles.renderOrder = 1000;
          sketchOutlineGroup.add(handles);
          sketchOutlines.push({ feature, line, fill, handles });
        });
      renderSketchSelection();
      applyVisibility();
    }

    /// Recolours every sketch outline and shows the selected one's corner
    /// handles: the selected sketch yellow, the rest by whether the build
    /// replayed them. Called after any selection change.
    function renderSketchSelection() {
      sketchOutlines.forEach(({ feature, line, handles }) => {
        const selected = selectedSketch && selectedSketch.id === feature.id;
        line.material.color.copy(srgb(selected ? 0xffdd55 : feature.active ? 0x5be0a0 : 0x666666));
        handles.visible = Boolean(selected) && !hiddenSketchIDs.has(feature.id);
      });
    }

    /// The nearest sketch under the pointer, or null. Every replayed sketch
    /// qualifies, not just the one at the tip: extruding one appends onto the
    /// current tip solid (see ContentView's appendExtrudeSketchFeature), and
    /// editing one replays the whole timeline over the new profile. A sketch
    /// the build rolled past is skipped - it is not in the document prefix an
    /// extrude would be appended to.
    function raycastSketch(event) {
      const candidates = sketchOutlines.filter(({ feature, fill }) => feature.active && fill.visible);
      if (!candidates.length) return null;
      raycaster.setFromCamera(pointerNDC(event), camera);
      const hits = raycaster.intersectObjects(candidates.map(({ fill }) => fill));
      if (!hits.length) return null;
      const entry = candidates.find(({ fill }) => fill === hits[0].object);
      return entry ? entry.feature : null;
    }

    function rectangleCorners(a, b) {
      const [ua, va] = sketchToLocal(a);
      const [ub, vb] = sketchToLocal(b);
      return [sketchToWorld(ua, va), sketchToWorld(ub, va), sketchToWorld(ub, vb), sketchToWorld(ua, vb)];
    }

    function buildSketchPlaneHelper(plane) {
      const size = 300;
      const geometry = new THREE.PlaneGeometry(size, size);
      const material = new THREE.MeshBasicMaterial({
        color: srgb(0x5be0a0),
        transparent: true,
        opacity: 0.08,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const helperMesh = new THREE.Mesh(geometry, material);
      helperMesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(plane.xDir, plane.yDir, plane.normal));
      helperMesh.position.copy(plane.origin);
      return helperMesh;
    }

    function sketchRaycastPoint(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const ndc = new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -((event.clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(ndc, camera);
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(sketchPlane.normal, sketchPlane.origin);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(plane, hit) ? hit : null;
    }

    function isNearScreenPoint(event, worldPoint, thresholdPx) {
      const rect = renderer.domElement.getBoundingClientRect();
      const projected = worldPoint.clone().project(camera);
      const screenX = ((projected.x + 1) / 2) * rect.width + rect.left;
      const screenY = ((1 - projected.y) / 2) * rect.height + rect.top;
      const dx = event.clientX - screenX;
      const dy = event.clientY - screenY;
      return Math.sqrt(dx * dx + dy * dy) < thresholdPx;
    }

    function updateSketchDrawHint() {
      if (sketchTool === "rect") {
        sketchDrawHintEl.textContent = sketchPoints.length === 0 ? "Click first corner" : "Click opposite corner";
      } else {
        sketchDrawHintEl.textContent =
          sketchPoints.length < 3
            ? "Click to add points (" + sketchPoints.length + ")"
            : "Click near the start to finish, or press Enter";
      }
    }

    function updateSketchPreview() {
      let previewPoints = [];
      if (sketchTool === "rect") {
        if (sketchPoints.length === 1 && sketchHoverPoint) {
          const corners = rectangleCorners(sketchPoints[0], sketchHoverPoint);
          previewPoints = [...corners, corners[0]];
        }
      } else {
        previewPoints = sketchPoints.slice();
        if (sketchHoverPoint) previewPoints.push(sketchHoverPoint);
      }
      sketchPreviewLine.geometry.dispose();
      sketchPreviewLine.geometry =
        previewPoints.length >= 2 ? new THREE.BufferGeometry().setFromPoints(previewPoints) : new THREE.BufferGeometry();
    }

    function startSketchPickPlane() {
      sketchStage = "pick-plane";
      sketchPlanePanelEl.style.display = "flex";
      updateToolbarState();
    }

    function enterSketchDrawStage() {
      sketchStage = "draw";
      clearHighlight();
      hideHint();
      sketchPlanePanelEl.style.display = "none";
      sketchDrawPanelEl.style.display = "flex";
      sketchPoints = [];
      sketchHoverPoint = null;
      sketchToolRectEl.classList.toggle("active", sketchTool === "rect");
      sketchToolPolygonEl.classList.toggle("active", sketchTool === "polygon");
      updateSketchDrawHint();

      // View the plane from whichever side the camera is already on, and roll
      // to the plane axis nearest the current screen up. Both keep the move
      // to the smallest rotation that still looks at the plane square on.
      const up = screenUp();
      const side = camera.position.clone().sub(sketchPlane.origin).dot(sketchPlane.normal) < 0 ? -1 : 1;
      const rolls = [sketchPlane.yDir, sketchPlane.xDir];
      const nearestRoll = rolls
        .flatMap((axis) => [axis.clone(), axis.clone().negate()])
        .reduce((best, axis) => (axis.dot(up) > best.dot(up) ? axis : best));
      moveCameraTo(sketchPlane.normal.clone().multiplyScalar(side), nearestRoll, sketchPlane.origin);
      controls.enableRotate = false;

      if (mesh) {
        dimmedMeshState = { transparent: mesh.material.transparent, opacity: mesh.material.opacity };
        mesh.material.transparent = true;
        mesh.material.opacity = 0.25;
      }

      sketchPlaneHelper = buildSketchPlaneHelper(sketchPlane);
      scene.add(sketchPlaneHelper);
      sketchPreviewLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: srgb(0x5be0a0) }));
      scene.add(sketchPreviewLine);
    }

    function handleSketchHover(event) {
      const point = sketchRaycastPoint(event);
      if (!point) return;
      sketchHoverPoint = point;
      updateSketchPreview();
    }

    function handleSketchClick(event) {
      const point = sketchRaycastPoint(event);
      if (!point) return;

      if (sketchTool === "rect") {
        if (sketchPoints.length === 0) {
          sketchPoints.push(point);
          updateSketchDrawHint();
          return;
        }
        finishSketch(rectangleCorners(sketchPoints[0], point));
        return;
      }

      if (sketchPoints.length >= 3 && isNearScreenPoint(event, sketchPoints[0], 12)) {
        finishSketch(sketchPoints);
        return;
      }
      sketchPoints.push(point);
      updateSketchDrawHint();
      updateSketchPreview();
    }

    function setSketchTool(tool) {
      if (sketchStage !== "draw") return;
      sketchTool = tool;
      sketchPoints = [];
      sketchToolRectEl.classList.toggle("active", tool === "rect");
      sketchToolPolygonEl.classList.toggle("active", tool === "polygon");
      updateSketchDrawHint();
      updateSketchPreview();
    }

    function dedupeConsecutivePoints(points) {
      return points.filter((point, index) => index === 0 || point.distanceTo(points[index - 1]) > 1e-6);
    }

    function finishSketch(points) {
      const polygon = dedupeConsecutivePoints(points).map((point) => sketchToLocal(point));
      const planePayload = sketchPlane.ref || {
        origin: sketchPlane.origin.toArray(),
        normal: sketchPlane.normal.toArray(),
        x_dir: sketchPlane.xDir.toArray(),
      };
      const message = { type: "add_sketch", plane: planePayload, polygon: polygon };
      exitSketchMode();
      postToSwift(message);
    }

    function cancelSketch() {
      exitSketchMode();
    }

    function exitSketchMode() {
      sketchStage = null;
      sketchPlane = null;
      sketchPoints = [];
      sketchHoverPoint = null;
      sketchPlanePanelEl.style.display = "none";
      sketchDrawPanelEl.style.display = "none";
      clearHighlight();
      hideHint();
      controls.enableRotate = true;
      updateToolbarState();

      if (sketchPlaneHelper) {
        scene.remove(sketchPlaneHelper);
        sketchPlaneHelper.geometry.dispose();
        sketchPlaneHelper.material.dispose();
        sketchPlaneHelper = null;
      }
      if (sketchPreviewLine) {
        scene.remove(sketchPreviewLine);
        sketchPreviewLine.geometry.dispose();
        sketchPreviewLine.material.dispose();
        sketchPreviewLine = null;
      }
      if (mesh && dimmedMeshState) {
        mesh.material.transparent = dimmedMeshState.transparent;
        mesh.material.opacity = dimmedMeshState.opacity;
      }
      dimmedMeshState = null;
    }

    ["XY", "XZ", "YZ"].forEach((name) => {
      document.querySelector('#sketch-plane-panel button[data-plane="' + name + '"]').addEventListener("click", () => {
        if (sketchStage !== "pick-plane") return;
        const def = SKETCH_PRINCIPAL_PLANES[name];
        sketchPlane = makeSketchPlane(def.origin, def.normal, def.xDir);
        sketchPlane.ref = name;
        enterSketchDrawStage();
      });
    });

    document.getElementById("sketch-plane-cancel").addEventListener("click", cancelSketch);
    document.getElementById("sketch-cancel").addEventListener("click", cancelSketch);
    sketchToolRectEl.addEventListener("click", () => setSketchTool("rect"));
    sketchToolPolygonEl.addEventListener("click", () => setSketchTool("polygon"));
    document.getElementById("sketch-finish").addEventListener("click", () => {
      if (sketchStage === "draw" && sketchTool === "polygon" && sketchPoints.length >= 3) finishSketch(sketchPoints);
    });

    renderer.domElement.addEventListener("dblclick", () => {
      if (sketchStage === "draw" && sketchTool === "polygon" && sketchPoints.length >= 3) finishSketch(sketchPoints);
    });

    // --- View cube ---------------------------------------------------
    // A small always-on gizmo showing the main camera's orientation. Its
    // own scene/camera/renderer stay in lockstep with the main camera's
    // rotation every frame; clicking a face, edge or corner snaps the main
    // camera to look straight at it, at the same distance from
    // controls.target as before.
    //
    // Screen left/right placement of FRONT vs RIGHT in the default corner
    // view is geometrically fixed by which Y face (+Y or -Y) the camera
    // sees: with Z-up and a camera on the +X,+Y,+Z side, +Y projects to
    // screen-right and -X/-Y project to screen-left. So +Y = RIGHT (not
    // LEFT) is what makes FRONT-left/RIGHT-right match the reference
    // ViewCube layout, given DEFAULT_VIEW_DIR below also sits on the +Y side.
    const AXIS_VIEWS = [
      // labelRotation counteracts BoxGeometry's default per-face UV
      // orientation, which isn't consistent across faces - without it, some
      // labels bake in reading sideways or upside down. Chosen by eye so
      // every face reads upright at the default isometric view.
      { label: "FRONT", dir: [1, 0, 0], up: [0, 0, 1], labelRotation: -90 },
      { label: "BACK", dir: [-1, 0, 0], up: [0, 0, 1], labelRotation: 90 },
      { label: "RIGHT", dir: [0, 1, 0], up: [0, 0, 1], labelRotation: 180 },
      { label: "LEFT", dir: [0, -1, 0], up: [0, 0, 1], labelRotation: 0 },
      { label: "TOP", dir: [0, 0, 1], up: [0, 1, 0], labelRotation: -90 },
      { label: "BOTTOM", dir: [0, 0, -1], up: [0, 1, 0], labelRotation: 90 },
    ];
    const DEFAULT_VIEW_DIR = new THREE.Vector3(1, 1, 1).normalize();
    const DEFAULT_UP = new THREE.Vector3(0, 0, 1);

    function makeFaceTexture(label, rotationDeg) {
      const size = 512;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#e8e8e8";
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = "#999";
      ctx.lineWidth = 12;
