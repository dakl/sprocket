<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sprocket viewer</title>
  <link rel="icon" href="icon.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
    canvas { display: block; }

    #hint, #status {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.85);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      padding: 6px 12px;
      border-radius: 6px;
      display: none;
      pointer-events: none;
    }

    /* Top-centre, not next to #status: a dropped op has to stay readable
       while the extrude and selection panels sit at the bottom. */
    #warning, #mesh-error {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      background: #3a1d1a;
      border: 1px solid #d0453a;
      color: #ff9a8a;
      font: 13px -apple-system, sans-serif;
      padding: 6px 12px;
      border-radius: 6px;
      display: none;
      pointer-events: none;
      max-width: 70%;
    }

    /* Section view controls. Bottom left, clear of the panels at the bottom centre. */
    #section-panel {
      position: fixed;
      left: 12px;
      bottom: 52px;
      background: rgba(30, 30, 30, 0.9);
      color: #eee;
      font: 12px -apple-system, sans-serif;
      padding: 8px 10px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    #section-panel button {
      background: #2a2a2a;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 2px 8px;
      font: inherit;
      cursor: pointer;
    }
    #section-panel button.active { border-color: #5be0a0; color: #5be0a0; }
    #section-offset { width: 140px; }
    #section-value { min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }

    /* What the selection measures, from the daemon's B-rep. Bottom right, clear
       of the extrude and selection panels at the bottom centre. */
    #measure-readout {
      position: fixed;
      right: 12px;
      bottom: 52px;
      background: rgba(30, 30, 30, 0.85);
      color: #ddd;
      font: 12px -apple-system, sans-serif;
      padding: 6px 10px;
      border-radius: 6px;
      display: none;
      pointer-events: none;
      white-space: pre;
      font-variant-numeric: tabular-nums;
    }

    /* Under #warning, so a dropped op and a mesh that would not write can both
       be on screen. */
    #mesh-error { top: 110px; }

    #extrude-panel {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.9);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    #extrude-panel .modify-title { font-weight: 600; color: #5be0a0; }

    /* The value box beside a drag handle's tip. Editable, not a readout: the
       drag writes into it, and typing over it sets the value exactly. For
       extrude it is the distance; for a Modify tool it mirrors the panel field
       the handle drives. index.html moves it every frame. */
    #handle-value {
      position: fixed;
      display: none;
      width: 6em;
      font: 13px -apple-system, sans-serif;
      color: #eee;
      background: rgba(28, 28, 28, 0.92);
      border: 1px solid #4aa3ff;
      border-radius: 4px;
      padding: 3px 6px;
      z-index: 5;
    }

    #handle-value:focus { outline: none; border-color: #9fd0ff; }

    #extrude-panel button {
      font: 13px -apple-system, sans-serif;
      padding: 4px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    #extrude-ok { background: #5be0a0; color: #103; }
    #extrude-cancel { background: #444; color: #eee; }

    /* The Modify tools' panel: one row of fields, a line for the preview's
       verdict, then OK and Cancel. */
    #modify-panel {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.92);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      flex-direction: column;
      gap: 8px;
      max-width: 90vw;
    }
    #modify-panel .modify-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
    #modify-panel .modify-title { font-weight: 600; color: #5be0a0; }
    #modify-panel label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    #modify-panel input[type="text"], #modify-panel select {
      width: 6em;
      font: 13px -apple-system, sans-serif;
      color: #eee;
      background: #1c1c1c;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
    }
    #modify-panel select { width: auto; }
    #modify-panel input:focus, #modify-panel select:focus { outline: none; border-color: #5be0a0; }
    #modify-info { color: #aaa; min-height: 1.2em; }
    #modify-info.bad { color: #ff8a80; }
    #modify-panel button { font: 13px -apple-system, sans-serif; padding: 4px 12px; border-radius: 4px; border: none; cursor: pointer; }
    #modify-ok { background: #5be0a0; color: #103; }
    #modify-ok:disabled { opacity: 0.4; cursor: default; }
    #modify-cancel { background: #444; color: #eee; }

    #timeline {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40px;
      background: rgba(20, 20, 20, 0.95);
      border-top: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .timeline-chip {
      font: 12px -apple-system, sans-serif;
      color: #ccc;
      background: #2c2c2c;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 4px 8px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .timeline-chip:hover { border-color: #5be0a0; }

    .timeline-chip.timeline-chip-inactive {
      opacity: 0.4;
      border-style: dashed;
    }

    /* An op the engine could not apply to the current geometry, usually
       because an earlier sketch was edited under it. */
    .timeline-chip.timeline-chip-failed {
      color: #ff9a8a;
      border-color: #d0453a;
      background: #3a1d1a;
      opacity: 1;
    }

    .timeline-chip .timeline-icon svg { width: 14px; height: 14px; vertical-align: -3px; }

    /* A row someone else just changed (an agent, or the file on disk): a
       short glow that fades, so the eye finds it without a lasting badge. */
    @keyframes changed-glow {
      from { box-shadow: 0 0 0 2px #5bb8e0; border-color: #5bb8e0; }
      to { box-shadow: 0 0 0 2px transparent; }
    }
    .timeline-chip.timeline-chip-changed { animation: changed-glow 1.8s ease-out; }

    /* Right-click menu on a face or a body row, and the colour popover. */
    #context-menu, #colour-popover {
      position: fixed;
      background: rgba(36, 36, 36, 0.97);
      border: 1px solid #555;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      display: none;
      z-index: 30;
    }
    #context-menu { padding: 4px 0; min-width: 170px; }
    #context-menu .menu-title { padding: 4px 12px 6px; color: #999; font-size: 11px; border-bottom: 1px solid #444; margin-bottom: 4px; }
    #context-menu button {
      display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit;
      font: inherit; padding: 5px 12px; cursor: pointer;
    }
    #context-menu button:hover, #context-menu button:focus { background: #2f5d8a; outline: none; }
    #colour-popover { padding: 10px; width: 196px; }
    #colour-popover .popover-title { color: #bbb; font-size: 12px; margin-bottom: 8px; }
    #colour-popover .palette, #colour-popover .recent { display: grid; grid-template-columns: repeat(6, 26px); gap: 6px; }
    #colour-popover .swatch {
      width: 26px; height: 26px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0; cursor: pointer;
    }
    #colour-popover .swatch:hover, #colour-popover .swatch:focus { outline: 2px solid #5bb8e0; outline-offset: 1px; }
    #colour-popover .popover-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
    #colour-popover input[type="text"] {
      width: 78px; background: #1e1e1e; color: #eee; border: 1px solid #555; border-radius: 4px;
      font: 12px ui-monospace, monospace; padding: 4px 6px;
    }
    #colour-popover input[type="text"].invalid { border-color: #d0453a; }
    #colour-popover input[type="color"] { width: 30px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
    #colour-popover button.apply {
      font: 12px -apple-system, sans-serif; background: #3a3a3a; color: #eee; border: 1px solid #666;
      border-radius: 4px; padding: 4px 8px; cursor: pointer;
    }
    #colour-popover .recent-label, #colour-popover .finish-label { color: #999; font-size: 11px; margin: 10px 0 6px; }
    #colour-popover .finishes { display: flex; flex-wrap: wrap; gap: 4px; }
    #colour-popover .finishes button {
      font: 11px -apple-system, sans-serif; background: #2c2c2c; color: #ddd; border: 1px solid #555;
      border-radius: 4px; padding: 3px 6px; cursor: pointer;
    }
    #colour-popover .finishes button.current { border-color: #5bb8e0; color: #fff; }

    /* The file changed on disk while this window had edits it does not hold. */
    #conflict {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      background: #2c2a1a;
      border: 1px solid #c9a227;
      color: #f0dc8a;
      font: 13px -apple-system, sans-serif;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
      align-items: center;
      gap: 10px;
      max-width: 80%;
      z-index: 20;
    }
    #conflict button {
      font: 12px -apple-system, sans-serif;
      background: #3a3a3a;
      color: #eee;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
    }

    /* The playhead sits in the gap between two chips: everything to its left
       is built, everything to its right is rolled back. It is absolutely
       positioned inside #timeline, so it scrolls with the chips. The wide,
       transparent box is the grab area. */
    #playhead {
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 14px;
      margin-left: -7px;
      cursor: ew-resize;
      touch-action: none;
      z-index: 2;
    }
    #playhead::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #5be0a0;
      border-radius: 1px;
    }
    #playhead::after {
      content: "";
      position: absolute;
      left: 2px;
      top: -1px;
      border: 5px solid transparent;
      border-top: 7px solid #5be0a0;
      border-bottom: 0;
    }

    /* --- Toolbar -------------------------------------------------------
       One row of grouped icon buttons. There is no workspace tab strip:
       sprocket models one solid part, so there is nothing to switch to.
       A disabled button is a placeholder: the op is not written yet, rather
       than unavailable right now. */
    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #262626;
      border-bottom: 1px solid #111;
      color: #ccc;
      user-select: none;
      z-index: 10;
    }

    #toolbar-groups { display: flex; align-items: stretch; padding: 4px 8px 0; }

    .tool-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      border-right: 1px solid #333;
    }

    .tool-group:last-child { border-right: none; }

    .tool-group-buttons { display: flex; gap: 2px; }

    .tool-group-label {
      font: 9px -apple-system, sans-serif;
      letter-spacing: 0.08em;
      color: #777;
      padding: 2px 0 3px;
    }

    .tool-button {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #ddd;
      cursor: pointer;
    }

    .tool-button svg { width: 18px; height: 18px; }
    .tool-button:hover:not(:disabled) { background: #333; border-color: #5be0a0; color: #5be0a0; }
    .tool-button.active { border-color: #5be0a0; color: #5be0a0; }
    .tool-button:disabled { color: #555; cursor: default; }

    .timeline-chip .timeline-edit { margin-left: 6px; color: #888; }
    .timeline-chip .timeline-edit svg { width: 12px; height: 12px; vertical-align: -2px; }
    .timeline-chip .timeline-edit:hover { color: #5be0a0; }

    /* --- Properties form -----------------------------------------------
       Generated from the op's JSON Schema (params-form.js). Sits under the
       view cube on the right. */
    #properties {
      position: fixed;
      top: 216px;
      right: 0;
      width: 260px;
      max-height: calc(100% - 272px);
      overflow-y: auto;
      background: rgba(28, 28, 28, 0.95);
      border: 1px solid #333;
      border-right: none;
      border-radius: 6px 0 0 6px;
      font: 12px -apple-system, sans-serif;
      color: #ddd;
      padding-bottom: 8px;
      z-index: 5;
    }
    #properties[hidden] { display: none; }
    .properties-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #888;
      padding: 6px 10px;
      border-bottom: 1px solid #333;
    }
    .properties-close { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer; }
    .properties-description { color: #999; padding: 6px 10px 2px; }
    .properties-row { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 0; }
    .properties-row input[type="text"], .properties-row textarea, .properties-row select {
      font: 12px ui-monospace, monospace;
      background: #2c2c2c;
      color: #eee;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 3px 5px;
    }
    .properties-row input:focus, .properties-row textarea:focus, .properties-row select:focus {
      outline: none;
      border-color: #5be0a0;
    }
    .properties-error { color: #ff9a8a; padding: 6px 10px 0; min-height: 1em; }

    /* --- Browser tree --------------------------------------------------
       Visibility only, for now: one eye per body and per sketch. */
    #browser {
      position: fixed;
      top: 62px;
      left: 0;
      width: 210px;
      max-height: calc(100% - 126px);
      overflow-y: auto;
      background: rgba(28, 28, 28, 0.95);
      border: 1px solid #333;
      border-left: none;
      border-radius: 0 6px 6px 0;
      font: 12px -apple-system, sans-serif;
      color: #ddd;
      user-select: none;
      z-index: 5;
    }

    #browser-header {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #888;
      padding: 6px 10px;
      border-bottom: 1px solid #333;
    }

    #browser-tree { padding: 4px 0 8px; }

    .browser-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px 2px 0;
      cursor: default;
    }

    .browser-row:hover { background: #2c2c2c; }
    .browser-row.selected { background: #33443c; }

    .browser-caret {
      flex: 0 0 auto;
      width: 12px;
      color: #888;
      text-align: center;
    }

    .browser-caret.clickable { cursor: pointer; }

    .browser-swatch {
      width: 16px;
      height: 14px;
      margin-left: auto;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }
    .browser-eye {
      flex: 0 0 auto;
      display: flex;
      color: #bbb;
      cursor: pointer;
    }

    .browser-eye svg { width: 14px; height: 14px; }
    .browser-eye.off { color: #555; }
    .browser-eye:hover { color: #5be0a0; }

    .browser-param { flex: 0 0 74px; min-width: 0; padding: 1px 4px; font: 12px ui-monospace, monospace; color: #eee; background: #262626; border: 1px solid #444; border-radius: 3px; }
    .browser-param:focus { outline: none; border-color: #5be0a0; }
    .browser-param.name { flex: 1 1 auto; }
    .browser-button { flex: 0 0 auto; padding: 0 5px; color: #999; cursor: pointer; }
    .browser-button:hover { color: #5be0a0; }
    .browser-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .browser-label.clickable { cursor: pointer; }
    .browser-label.dim { color: #777; }

    #sketch-plane-panel, #sketch-draw-panel {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      background: rgba(30, 30, 30, 0.9);
      color: #eee;
      font: 13px -apple-system, sans-serif;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    #sketch-draw-panel { flex-wrap: wrap; justify-content: center; width: max-content; max-width: 92vw; white-space: normal; }
    #sketch-plane-panel > *, #sketch-draw-panel > * { flex-shrink: 0; }

    #sketch-plane-offset { width: 5em; padding: 3px 5px; font: 13px -apple-system, sans-serif; color: #eee; background: #262626; border: 1px solid #555; border-radius: 4px; }
    #sketch-plane-panel button, #sketch-draw-panel button {
      font: 13px -apple-system, sans-serif;
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #333;
      color: #eee;
      cursor: pointer;
    }

    #sketch-draw-panel button { padding: 4px 9px; }
    #sketch-draw-panel button:disabled { opacity: 0.35; cursor: default; }
    #sketch-draw-panel button.active { background: #5be0a0; color: #103; border-color: #5be0a0; }
    .sketch-panel-group { display: flex; gap: 4px; padding-right: 10px; border-right: 1px solid #444; }
    .sketch-hint-inline { color: #999; }
    #sketch-finish { background: #5be0a0; color: #103; border-color: #5be0a0; }
    #sketch-plane-cancel, #sketch-cancel { background: #444; }
    #sketch-status { color: #bbb; min-width: 14em; }
    #sketch-state { color: #5be0a0; }

    #sketch-labels { position: fixed; left: 0; top: 0; pointer-events: none; }
    .sketch-dimension-label {
      position: fixed;
      pointer-events: auto;
      background: rgba(30, 30, 30, 0.85);
      color: #ffdd55;
      font: 12px -apple-system, sans-serif;
      padding: 1px 5px;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }
    .sketch-glyph {
      position: fixed;
      pointer-events: auto;
      min-width: 14px;
      box-sizing: border-box;
      text-align: center;
      background: rgba(30, 30, 30, 0.85);
      color: #9ad1ff;
      font: 12px -apple-system, sans-serif;
      line-height: 14px;
      padding: 1px 3px;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }
    .sketch-glyph.selected, .sketch-dimension-label.selected { background: #ffaa00; color: #222; }
    .sketch-glyph.conflict, .sketch-dimension-label.conflict { background: #d9534f; color: #fff; }
    .sketch-snap { position: fixed; pointer-events: none; }
    .sketch-snap .glyph {
      position: absolute;
      left: -6px;
      top: -6px;
      width: 12px;
      height: 12px;
      box-sizing: border-box;
      border: 2px solid #ffdd55;
    }
    .sketch-snap[data-kind="curve"] .glyph { border-radius: 50%; }
    .sketch-snap .text {
      position: absolute;
      left: 12px;
      top: 8px;
      white-space: nowrap;
      background: rgba(30, 30, 30, 0.85);
      color: #ffdd55;
      font: 12px -apple-system, sans-serif;
      padding: 1px 5px;
      border-radius: 3px;
    }
    #sketch-dimension {
      position: fixed;
      display: none;
      width: 84px;
      font: 13px -apple-system, sans-serif;
      padding: 3px 6px;
      border: 1px solid #ffdd55;
      border-radius: 4px;
      background: #222;
      color: #fff;
    }

    #view-cube {
      position: fixed;
      top: 70px;
      right: 16px;
      width: 132px;
      height: 132px;
    }

    #view-cube canvas { cursor: pointer; }

    #view-cube-home {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 24px;
      height: 24px;
      border: none;
      background: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eee;
      cursor: pointer;
    }

    #view-cube-home:hover { color: #5be0a0; }
  </style>
</head>
<body>
  <div id="hint"></div>
  <div id="status"></div>
  <div id="warning"></div>
  <div id="mesh-error"></div>
  <div id="measure-readout" aria-live="polite"></div>
  <div id="section-panel" role="group" aria-label="Section view">
    <span>Section</span>
    <button data-axis="X">X</button><button data-axis="Y">Y</button><button data-axis="Z">Z</button>
    <input type="range" id="section-offset" step="any" aria-label="Section offset" />
    <span id="section-value"></span>
    <button id="section-flip">Flip</button>
  </div>
  <div id="context-menu" role="menu"></div>
  <div id="colour-popover" role="dialog" aria-label="Colour">
    <div class="popover-title"></div>
    <div class="palette"></div>
    <div class="popover-row">
      <input type="text" id="colour-hex" placeholder="#rrggbb" maxlength="7" aria-label="Hex colour" />
      <input type="color" id="colour-native" title="More colours" aria-label="More colours" />
      <button class="apply" id="colour-apply">Apply</button>
    </div>
    <div class="recent-label">Recent</div>
    <div class="recent"></div>
    <div class="finish-label">Finish</div>
    <div class="finishes"></div>
  </div>
  <div id="conflict" role="alert"><span id="conflict-text"></span><button id="conflict-file">Use the file</button><button id="conflict-mine">Keep mine</button></div>
  <input id="handle-value" type="text" autocomplete="off" spellcheck="false" aria-label="Value" />
  <div id="extrude-panel">
    <span class="modify-title">Extrude</span>
    <button id="extrude-ok">OK</button>
    <button id="extrude-cancel">Cancel</button>
  </div>
  <div id="modify-panel" role="dialog" aria-label="Modify">
    <div class="modify-row"><span class="modify-title" id="modify-title"></span><span id="modify-fields" class="modify-row"></span></div>
    <div id="modify-info" aria-live="polite"></div>
    <div class="modify-row"><button id="modify-ok">OK</button><button id="modify-cancel">Cancel</button></div>
  </div>
  <div id="toolbar">
    <div id="toolbar-groups">
      <div class="tool-group">
        <div class="tool-group-buttons">
          <button class="tool-button" id="tool-new" title="New document (clears every feature, Cmd+Z restores)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" /><path d="M14 2v5h5" /><path d="M12 11v6" /><path d="M9 14h6" /></svg></button>
          <button class="tool-button" id="tool-export" title="Export the part as STL, 3MF or STEP"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12" /><path d="m8 7 4-4 4 4" /><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" /></svg></button>
        </div>
        <div class="tool-group-label">FILE</div>
      </div>
      <div class="tool-group">
        <div class="tool-group-buttons">
          <button class="tool-button" id="tool-sketch" title="Sketch (S)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21h8" /><path d="m15 5 4 4" /><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /></svg></button>
          <button class="tool-button" id="tool-extrude" disabled title="Extrude the selection (E)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 9-6-6-6 6" /><path d="M12 3v14" /><path d="M5 21h14" /></svg></button>
          <button class="tool-button" id="tool-revolve" disabled title="Revolve (R): sweep the selected sketch around an axis"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="5" ry="9" /><path d="M3 12h18" /></svg></button>
          <button class="tool-button" id="tool-hole" disabled title="Hole (H): drill the picked face"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="3" /></svg></button>
        </div>
        <div class="tool-group-label">CREATE</div>
      </div>
      <div class="tool-group">
        <div class="tool-group-buttons">
          <button class="tool-button" disabled title="Press pull - click a face in the viewport"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20" /><path d="m8 6 4-4 4 4" /><path d="m8 18 4 4 4-4" /></svg></button>
          <button class="tool-button" id="tool-fillet" disabled title="Fillet (F): round the selected edges, or every edge of the selected face. Shift-click adds edges"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10a6 6 0 0 1 6-6h10" /><path d="M4 10V4h6" stroke-dasharray="2 2" /></svg></button>
          <button class="tool-button" id="tool-chamfer" disabled title="Chamfer (C): bevel the selected edges, or every edge of the selected face. Shift-click adds edges"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-8l8-8h8" /><path d="M4 12V4h8" stroke-dasharray="2 2" /></svg></button>
          <button class="tool-button" id="tool-shell" disabled title="Shell: hollow the part, the picked face is left open"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" /><rect x="7" y="7" width="10" height="10" rx="1" /></svg></button>
          <button class="tool-button" id="tool-combine" disabled title="Combine: join, cut or intersect two bodies"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="6" /><circle cx="15" cy="12" r="6" /></svg></button>
          <button class="tool-button" disabled title="Parameters - not implemented yet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7" /><path d="M4 10V3" /><path d="M12 21v-9" /><path d="M12 8V3" /><path d="M20 21v-5" /><path d="M20 12V3" /><path d="M1 14h6" /><path d="M9 8h6" /><path d="M17 16h6" /></svg></button>
        </div>
        <div class="tool-group-label">MODIFY</div>
      </div>
      <div class="tool-group">
        <div class="tool-group-buttons">
          <button class="tool-button" id="tool-mirror" disabled title="Mirror: pick a body in the browser, then the plane to copy it across"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 2" /><path d="M8 7 3 12l5 5z" /><path d="m16 7 5 5-5 5z" /></svg></button>
          <button class="tool-button" id="tool-linear" disabled title="Linear pattern: pick a body in the browser, then a direction, a count and a spacing"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="6" height="6" rx="1" /><rect x="9" y="9" width="6" height="6" rx="1" /><rect x="16" y="9" width="6" height="6" rx="1" /></svg></button>
          <button class="tool-button" id="tool-circular" disabled title="Circular pattern: pick a body in the browser, then an axis, a count and an angle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5" /><rect x="9.5" y="2" width="5" height="5" rx="1" /><rect x="16" y="14" width="5" height="5" rx="1" /><rect x="3" y="14" width="5" height="5" rx="1" /></svg></button>
        </div>
        <div class="tool-group-label">PATTERN</div>
      </div>
      <div class="tool-group">
        <div class="tool-group-buttons">
          <button class="tool-button" id="tool-offset-plane" title="Offset plane: a named plane moved along its normal from XY, XZ, YZ, a face or another plane"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 6-4 12 4-6 4z" /><path d="m3 16 6-4 12 4-6 4z" stroke-dasharray="2 2" /></svg></button>
          <button class="tool-button" id="tool-axis" disabled title="Axis: pick a round face or an edge, and name its axis"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 20 4" stroke-dasharray="3 3" /><circle cx="4" cy="20" r="1.5" /><circle cx="20" cy="4" r="1.5" /></svg></button>
          <button class="tool-button" id="tool-point" title="Point: a named point. A picked face or edge fills in its centre"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2" /><path d="M12 3v4" /><path d="M12 17v4" /><path d="M3 12h4" /><path d="M17 12h4" /></svg></button>
        </div>
        <div class="tool-group-label">CONSTRUCT</div>
      </div>
      <div class="tool-group">
        <div class="tool-group-buttons">
          <button class="tool-button" id="tool-measure" title="Measure (I): the selection, or each body's volume"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 3 6 6L9 21l-6-6z" /><path d="m7 13 2 2" /><path d="m11 9 2 2" /><path d="m15 5 2 2" /></svg></button>
          <button class="tool-button" id="tool-section" title="Section view: cut the part with a plane"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="14" rx="1" /><path d="M2 12h20" stroke-dasharray="3 2" /></svg></button>
        </div>
        <div class="tool-group-label">INSPECT</div>
      </div>
    </div>
  </div>
  <aside id="browser">
    <div id="browser-header">BROWSER</div>
    <div id="browser-tree"></div>
  </aside>
  <div id="sketch-plane-panel">
    <span>Sketch on:</span>
    <button data-plane="XY">XY</button>
    <button data-plane="XZ">XZ</button>
    <button data-plane="YZ">YZ</button>
    <span id="sketch-plane-constructs"></span>
    <label class="sketch-hint-inline" title="Move the plane along its normal. Negative goes the other way">Offset <input id="sketch-plane-offset" type="number" step="any" value="0" /> mm</label>
    <span class="sketch-hint-inline">or click a face</span>
    <button id="sketch-plane-cancel">Cancel</button>
  </div>
  <div id="sketch-draw-panel">
    <div class="sketch-panel-group">
      <button data-tool="select" title="Select and drag (S)">Select</button>
      <button data-tool="line" title="Line (L)">Line</button>
      <button data-tool="rectangle" title="Rectangle (R)">Rectangle</button>
      <button data-tool="circle" title="Circle (C)">Circle</button>
      <button data-tool="arc" title="Three-point arc (A)">Arc</button>
      <button data-tool="dimension" title="Dimension (D). Between two points, press H, V or A in the box to measure across, up or straight">Dimension</button>
      <button data-tool="fillet" title="Fillet (F): round a corner where two lines meet with an arc of the radius you type">Fillet</button>
      <button data-tool="project" title="Project (P): click an edge of another sketch or of the part to bring it into this sketch as a locked reference">Project</button>
      <button data-tool="trim" title="Trim (T): click the piece of a line, arc or circle between the shapes that cross it to remove it">Trim</button>
      <button data-tool="extend" title="Extend (E): click near the end of a line or arc to run it on to the next shape in its way">Extend</button>
      <button data-tool="offset" title="Offset (O): click a shape, move to the side you want, type a distance. Lines and arcs that join move together">Offset</button>
    </div>
    <div class="sketch-panel-group">
      <button data-constraint="coincident" title="Two points meet">Coincident</button>
      <button data-constraint="point_on" title="A point lies on a line, circle or arc">On curve</button>
      <button data-constraint="horizontal" title="A line, or two points, level">Horizontal</button>
      <button data-constraint="vertical" title="A line, or two points, upright">Vertical</button>
      <button data-constraint="parallel" title="Two lines parallel">Parallel</button>
      <button data-constraint="perpendicular" title="Two lines at a right angle">Perpendicular</button>
      <button data-constraint="tangent" title="A curve touches a line or curve">Tangent</button>
      <button data-constraint="equal" title="Equal length or radius">Equal</button>
      <button data-constraint="fix" title="Lock a point or shape in place">Fix</button>
      <button data-constraint="symmetric" title="Two points are mirror images across a line: select the two points and the line">Symmetric</button>
    </div>
    <div class="sketch-panel-group">
      <button id="sketch-mirror" title="Mirror (M): copy the selected shapes across a line. Pick the shapes, then shift-click the line last" disabled>Mirror</button>
      <button id="sketch-construction" title="Construction (X): turn the selected shapes into dashed guides that bound no region, or back" disabled>Construction</button>
      <button id="sketch-constraints-toggle" title="Show or hide the constraint glyphs">Constraints</button>
    </div>
    <span id="sketch-status"></span>
    <span id="sketch-state"></span>
    <button id="sketch-finish">Finish sketch</button>
    <button id="sketch-cancel">Cancel</button>
  </div>
  <div id="sketch-labels"></div>
  <input id="sketch-dimension" type="text" autocomplete="off" spellcheck="false" />
  <div id="timeline"><div id="playhead" title="Drag to roll the model back and forward"></div></div>
  <aside id="properties" hidden></aside>
  <div id="view-cube">
    <button id="view-cube-home" title="Reset to the default view">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      </svg>
    </button>
  </div>

  <script src="vendor/OrbitControls.js"></script>
  <script src="params-form.js"></script>
  <script src="edits.js"></script>
  <script src="modify.js"></script>
  <script src="handles.js"></script>
  <script src="live.js"></script>
  <script src="colours.js"></script>
  <script src="wheel-zoom.js"></script>
  <script src="vendor/planegcs.js"></script>
  <script src="sketch-solver.js"></script>
  <script src="sketch-model.js"></script>
  <script src="sketch-tools.js"></script>
  <script src="sketcher.js"></script>
  <script src="main.js"></script>
</body>
</html>
