[project]
name = "sprocket-engine"
version = "0.12.0"
description = "Sprocket's headless geometry engine: JSON op log -> build123d -> BREP"
readme = "README.md"
authors = [
    { name = "Daniel Klevebring", email = "daniel.klevebring@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "jsonschema>=4.26.0",
    # render.py rasterises with it. ocp-tessellate already pulls it in, but a
    # module that imports it directly declares it directly.
    "numpy>=2.0",
    "ocp-tessellate>=3.5.3",
]

[project.optional-dependencies]
# Only `sprocket mcp` needs this. The Swift app launches `sprocket daemon`,
# which must not fail to start because an agent-facing dependency is missing.
mcp = ["mcp>=2.0"]
# The engine's copy of the viewer's constraint solver (see solver.py). Pinned
# exactly: tests/test_solver_parity.py compares it with the viewer's solver, and
# a different release can move the answers. It has no macOS wheel, so a Mac
# builds it from source: `brew install eigen boost`, then `make test-solver`.
solver = ["planegcs==0.8.0"]
# Modeled threads (ops/thread.py). Cosmetic threads, the default, need nothing.
threads = ["bd-warehouse>=0.3.0,<0.4"]

[project.scripts]
sprocket = "sprocket_engine:main"

# Tests and checks only. The bundled app installs without them (`uv sync --no-dev`).
[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# Strict on purpose, old code included: `make lint` fails until the old code
# meets it. Ignore a rule here only when it conflicts with another one.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before a class docstring)
    "D213",   # conflicts with D212 (summary on the docstring's first line)
    "COM812", # conflicts with the formatter
    "CPY001", # a private repo with no licence header convention
]

[tool.ruff.lint.per-file-ignores]
# pytest checks with bare `assert`.
"tests/**" = ["S101"]

# "all" turns every rule on, reportAny and reportExplicitAny among them, so a
# `dict[str, Any]` is an error: a domain object gets a dataclass, a pydantic
# model or a TypedDict.
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["src", "tests", "tools"]
venvPath = "."
venv = ".venv"
