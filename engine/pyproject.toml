[project]
name = "sprocket-engine"
version = "0.3.0"
description = "Sprocket's headless geometry engine: JSON op log -> build123d -> BREP"
readme = "README.md"
authors = [
    { name = "Daniel Klevebring", email = "daniel.klevebring@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "hypothesis>=6.168.3",
    "jsonschema>=4.26.0",
    # render.py rasterises with it. ocp-tessellate already pulls it in, but a
    # module that imports it directly declares it directly.
    "numpy>=2.0",
    "ocp-tessellate>=3.5.3",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
# Only `sprocket mcp` needs this. The Swift app launches `sprocket daemon`,
# which must not fail to start because an agent-facing dependency is missing.
mcp = ["mcp>=2.0"]

[project.scripts]
sprocket = "sprocket_engine:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
