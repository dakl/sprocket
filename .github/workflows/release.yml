name: release

# Push a tag like v0.2.0 to publish the engine wheel, the example documents and
# the app as a DMG. The DMG is unsigned until phase 3 of docs/PACKAGING.md, so
# Gatekeeper blocks it on other Macs.
#
# Run the workflow by hand ("Run workflow") to try the DMG build with no tag. It
# then skips the release and keeps the DMG as a build artifact. Give it a
# `release` (such as v0.10.0) to build the DMG and add it to that existing
# release instead, for when a tag's DMG job failed.
#
# A tag's DMG goes to the release only, not to artifact storage as well: a full
# artifact quota failed the v0.10.0 DMG job before it reached the release.
#
# A DMG that goes to a release also goes, signed for Sparkle, to the public
# repo dakl/sprocket-releases with a one-item appcast.xml. Installed apps read
# that feed (docs/PACKAGING.md, "Auto-update"). It needs two secrets:
# SPARKLE_PRIVATE_KEY (`generate_keys --account sprocket -x <file>`) and
# RELEASES_TOKEN (a fine-grained token with contents write on that repo only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Existing release to add the DMG to (e.g. v0.10.0). Empty keeps it as an artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml would publish a wheel whose
      # filename names a different version than the release.
      - name: Check the tag matches the engine version
        run: |
          version=$(grep -m1 '^version' engine/pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match engine version v$version"
            exit 1
          fi

      - name: Run the tests
        working-directory: engine
        run: |
          uv sync --extra mcp
          uv run pytest

      - name: Build the wheel and sdist
        working-directory: engine
        run: uv build --out-dir dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            engine/dist/*.whl engine/dist/*.tar.gz examples/*.sprocket

  dmg:
    needs: release
    # Also runs when the release job was skipped (a manual run).
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Build the DMG
        run: app/make_dmg.sh

      - name: Name the DMG after the version
        env:
          NAME: ${{ inputs.release || github.ref_name }}
        run: cp app/.build/Sprocket.dmg "Sprocket-${NAME//\//-}.dmg"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag' && inputs.release == ''
        with:
          name: dmg
          path: Sprocket-*.dmg

      - name: Add the DMG to the release
        if: github.ref_type == 'tag' || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release || github.ref_name }}
        run: gh release upload "$RELEASE" Sprocket-*.dmg --clobber

      # The appcast holds only this release: Sparkle needs nothing older. The
      # release notes go in as preformatted text, because they are markdown.
      - name: Publish the update to dakl/sprocket-releases
        if: github.ref_type == 'tag' || inputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE: ${{ inputs.release || github.ref_name }}
        run: |
          mkdir feed
          cp Sprocket-*.dmg feed/
          {
            echo "<pre>"
            GH_TOKEN="$SOURCE_TOKEN" gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json body -q .body \
              | sed 's/&/\&amp;/g; s/</\&lt;/g'
            echo "</pre>"
          } > "feed/$(basename feed/Sprocket-*.dmg .dmg).html"
          echo "$SPARKLE_PRIVATE_KEY" | app/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/dakl/sprocket-releases/releases/download/$RELEASE/" \
            feed
          if gh release view "$RELEASE" --repo dakl/sprocket-releases > /dev/null 2>&1; then
            gh release upload "$RELEASE" --repo dakl/sprocket-releases --clobber feed/*.dmg feed/appcast.xml
          else
            gh release create "$RELEASE" --repo dakl/sprocket-releases --title "$RELEASE" \
              --notes "Sprocket $RELEASE." --latest feed/*.dmg feed/appcast.xml
          fi
