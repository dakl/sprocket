name: release

# Run this workflow on main to publish a release. Pick which part of the
# version to raise (patch, minor or major):
#
#   gh workflow run release --ref main -f bump=minor
#
# It runs the engine tests, raises the version in engine/pyproject.toml and
# engine/uv.lock, commits that to main as "chore: release X.Y.Z", tags it
# vX.Y.Z and publishes the engine wheel, the example documents and the app as
# a DMG. The DMG is signed with a Developer ID and notarised, so Gatekeeper
# opens it on any Mac. That needs the five secrets codez and papershelf use:
# CSC_LINK (the Developer ID Application .p12, base64), CSC_KEY_PASSWORD,
# APPLE_ID, SPROCKET_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID. Without CSC_LINK the
# DMG job fails: Gatekeeper blocks an unsigned DMG, so nobody could open it.
#
# Give it a `release` (such as v0.10.0) to raise no version and build that
# existing release's DMG again from its tag, for when a DMG job failed.
#
# The DMG goes to the release only, not to artifact storage as well: a full
# artifact quota failed the v0.10.0 DMG job before it reached the release.
#
# The DMG also goes, signed for Sparkle, to the public repo
# dakl/sprocket-releases with a one-item appcast.xml. Installed apps read
# that feed (docs/PACKAGING.md, "Auto-update"). It needs two secrets:
# SPARKLE_PRIVATE_KEY (`generate_keys --account sprocket -x <file>`) and
# RELEASES_TOKEN (a fine-grained token with contents write on that repo only).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch
      release:
        description: "Instead, build the DMG again for this existing release (e.g. v0.10.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    if: inputs.release == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Check the run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "run the release on main, not $GITHUB_REF_NAME"
          exit 1

      # Checked here too, so a missing certificate stops the release before
      # it raises the version and tags it.
      - name: Check the signing certificate is set
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::CSC_LINK is not set. Gatekeeper blocks an unsigned DMG, so the release stops here"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Run the tests
        working-directory: engine
        run: |
          uv sync --extra mcp
          uv run pytest

      # The engine's version is the release version: the app reads it too.
      - name: Raise the version
        id: bump
        working-directory: engine
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv version --bump "$BUMP" --no-sync
          echo "tag=v$(uv version --short)" >> "$GITHUB_OUTPUT"

      # --atomic pushes both or neither. If main moved after the checkout the
      # push fails and nothing is published: run the workflow again.
      - name: Commit and tag the version
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add engine/pyproject.toml engine/uv.lock
          git commit -m "chore: release ${TAG#v}"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Build the wheel and sdist
        working-directory: engine
        run: uv build --out-dir dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            engine/dist/*.whl engine/dist/*.tar.gz examples/*.sprocket

  dmg:
    needs: release
    # Also runs when the release job was skipped (a DMG rebuild).
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: macos-14
    env:
      RELEASE: ${{ inputs.release || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE }}
      - uses: astral-sh/setup-uv@v3

      # The certificate goes into a keychain of its own, which the runner
      # deletes with the machine. make_dmg.sh signs when SIGN_IDENTITY is set.
      - name: Import the Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::CSC_LINK is not set. Gatekeeper blocks an unsigned DMG, so the release stops here"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          test -n "$IDENTITY" || { echo "no Developer ID Application identity in CSC_LINK"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the DMG
        run: app/make_dmg.sh

      # Before the Sparkle step: stapling changes the DMG, and the EdDSA
      # signature must cover the final file.
      - name: Notarise the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.SPROCKET_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app/notarize.sh app/.build/Sprocket.dmg
          spctl --assess --type open --context context:primary-signature -v app/.build/Sprocket.dmg

      - name: Name the DMG after the version
        run: cp app/.build/Sprocket.dmg "Sprocket-$RELEASE.dmg"

      - name: Add the DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE" Sprocket-*.dmg --clobber

      # The appcast holds only this release: Sparkle needs nothing older. The
      # release notes go in as preformatted text, because they are markdown.
      - name: Publish the update to dakl/sprocket-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SOURCE_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir feed
          cp Sprocket-*.dmg feed/
          {
            echo "<pre>"
            GH_TOKEN="$SOURCE_TOKEN" gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json body -q .body \
              | sed 's/&/\&amp;/g; s/</\&lt;/g'
            echo "</pre>"
          } > "feed/$(basename feed/Sprocket-*.dmg .dmg).html"
          echo "$SPARKLE_PRIVATE_KEY" | app/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/dakl/sprocket-releases/releases/download/$RELEASE/" \
            feed
          if gh release view "$RELEASE" --repo dakl/sprocket-releases > /dev/null 2>&1; then
            gh release upload "$RELEASE" --repo dakl/sprocket-releases --clobber feed/*.dmg feed/appcast.xml
          else
            gh release create "$RELEASE" --repo dakl/sprocket-releases --title "$RELEASE" \
              --notes "Sprocket $RELEASE." --latest feed/*.dmg feed/appcast.xml
          fi
