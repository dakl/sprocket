name: metrics

on:
  push:
    branches: [main]
  pull_request:

# Reports only. A number that moves the wrong way is explained in the PR, never
# gated: tools/metrics.py says why.
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make metrics
      # This branch's script measures the base too, so a change to the script
      # cannot read as a change to the code.
      - name: Measure the base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$BASE"
          git worktree add ../base "$BASE"
          uv run --script tools/metrics.py --root ../base --out base.json
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - name: Write the job summary
        run: |
          if [ -f base.json ]; then base="--base base.json"; fi
          uv run --script tools/metrics.py report metrics.json $base >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            metrics.json
            base.json
          if-no-files-found: ignore
