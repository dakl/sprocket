name: engine tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # The MCP tests need the mcp extra; a plain sync leaves out mcp and anyio. The
      # solver extra is planegcs, which tests/test_solver_parity.py compares with
      # the viewer's solver under node. Linux has a wheel for it.
      - run: uv sync --extra mcp --extra solver
      - run: uv run pytest -v
