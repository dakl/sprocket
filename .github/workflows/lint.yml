name: lint

on:
  push:
    branches: [main]
  pull_request:

# Strict on purpose, old code included, so these fail until the old code meets
# them. Each check is its own step and runs even when an earlier one failed.
jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # The extras, so basedpyright can resolve their imports.
      - run: uv sync --extra mcp --extra solver --extra threads
      - name: ruff check
        run: uv run --no-sync ruff check --output-format github
      - name: ruff format
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff format --check
      - name: basedpyright
        if: ${{ !cancelled() }}
        run: uv run --no-sync basedpyright

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Biome resolves the e2e tests' imports from here.
      - run: npm ci
        working-directory: e2e
      - name: biome
        run: npx biome ci --reporter github
      - name: tsc viewer
        if: ${{ !cancelled() }}
        run: npx tsc -p viewer
      - name: tsc e2e
        if: ${{ !cancelled() }}
        run: npx tsc -p e2e

  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: swift format
        run: swift format lint --strict --recursive Sources Tests Package.swift
      # Package.swift stays on Swift 5 so the app still builds; this checks it under 6.
      - name: swift 6 build
        if: ${{ !cancelled() }}
        run: swift build --build-tests -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
